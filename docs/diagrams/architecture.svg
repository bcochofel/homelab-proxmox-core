<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" width="1400" height="1060" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="1060" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">homelab-proxmox-core — network architecture</text>

  <!-- Internet -->
  <rect x="645" y="40" width="160" height="56" rx="28" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="725" y="73" text-anchor="middle" font-size="16" fill="#334155">Internet</text>

  <!-- Deco Mesh -->
  <rect x="595" y="135" width="260" height="72" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="725" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#4c1d95">Deco Mesh</text>
  <text x="725" y="181" text-anchor="middle" font-size="13" fill="#5b21b6">Router / Gateway &#183; DHCP</text>
  <text x="725" y="198" text-anchor="middle" font-size="13" fill="#5b21b6">192.168.68.1</text>

  <line x1="725" y1="96" x2="725" y2="133" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)"/>

  <!-- LAN bus -->
  <line x1="180" y1="290" x2="1280" y2="290" stroke="#334155" stroke-width="2"/>
  <text x="725" y="278" text-anchor="middle" font-size="14" fill="#334155">LAN 192.168.68.0/22</text>
  <line x1="725" y1="207" x2="725" y2="290" stroke="#334155" stroke-width="2"/>
  <line x1="340" y1="290" x2="340" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <line x1="810" y1="290" x2="810" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <line x1="1150" y1="290" x2="1150" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="355" y="306" font-size="12.5" fill="#1d4ed8">LAN clients use NS1 / Pi-hole (primary) as DNS</text>

  <!-- Proxmox container -->
  <rect x="60" y="315" width="560" height="460" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="82" y="341" font-size="15" font-weight="bold" fill="#334155">Proxmox VE (pve1) &#183; 192.168.68.20</text>

  <!-- proxy VM -->
  <rect x="90" y="360" width="500" height="108" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="382" font-size="14" font-weight="bold" fill="#1e293b">proxy VM &#183; 192.168.68.16</text>
  <rect x="110" y="392" width="460" height="62" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="340" y="416" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#065f46">Caddy &#8212; reverse proxy + ACME</text>
  <text x="340" y="434" text-anchor="middle" font-size="12" fill="#065f46">nas &#183; www &#183; pve1 &#183; kibana (elastic repo) &#8212; see caddy_sites</text>

  <!-- server01 VM -->
  <rect x="90" y="486" width="500" height="270" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="110" y="510" font-size="14" font-weight="bold" fill="#1e293b">server01 VM &#183; 192.168.68.15</text>
  <text x="110" y="528" font-size="12" fill="#64748b">(Ansible inventory group: dns)</text>

  <!-- NS1 -->
  <rect x="120" y="544" width="220" height="192" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="230" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">NS1 &#183; 192.168.68.2</text>
  <text x="230" y="590" text-anchor="middle" font-size="13" fill="#1e40af">CoreDNS</text>
  <text x="230" y="610" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">PRIMARY (authoritative)</text>
  <text x="230" y="630" text-anchor="middle" font-size="12" fill="#1e40af">homelab.bcochofel.com</text>
  <text x="230" y="650" text-anchor="middle" font-size="12" fill="#1e40af">acl: 192.168.68.0/22 only</text>
  <text x="230" y="670" text-anchor="middle" font-size="12" fill="#1e40af">transfer -&gt; NS2 (AXFR)</text>

  <!-- Pi-hole PRIMARY -->
  <rect x="370" y="544" width="210" height="192" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
  <text x="475" y="568" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Pi-hole</text>
  <text x="475" y="587" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">PRIMARY</text>
  <text x="475" y="606" text-anchor="middle" font-size="12.5" fill="#78350f">192.168.68.5</text>
  <text x="475" y="625" text-anchor="middle" font-size="12" fill="#92400e">ad-blocking only</text>
  <text x="475" y="643" text-anchor="middle" font-size="12" fill="#92400e">forwards homelab zone</text>
  <text x="475" y="661" text-anchor="middle" font-size="12" fill="#92400e">to NS1 + NS2</text>
  <text x="475" y="679" text-anchor="middle" font-size="11.5" fill="#b45309">(DHCP cutover pending)</text>

  <!-- Pi-hole PRIMARY -> NS1 (conditional forward) -->
  <path d="M 370,640 C 360,640 350,640 340,640" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>

  <!-- QNAP container -->
  <rect x="650" y="315" width="320" height="460" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="672" y="341" font-size="15" font-weight="bold" fill="#334155">QNAP TS-230 &#183; 192.168.68.10</text>
  <text x="672" y="359" font-size="12" fill="#64748b">(file/NAS services + CoreDNS secondary)</text>

  <!-- NS2 -->
  <rect x="675" y="544" width="270" height="192" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="810" y="570" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">NS2 &#183; 192.168.68.3</text>
  <text x="810" y="590" text-anchor="middle" font-size="13" fill="#1e40af">CoreDNS</text>
  <text x="810" y="610" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1d4ed8">SECONDARY</text>
  <text x="810" y="630" text-anchor="middle" font-size="12" fill="#1e40af">AXFR pull from NS1</text>
  <text x="810" y="650" text-anchor="middle" font-size="12" fill="#1e40af">acl: 192.168.68.0/22 only</text>
  <text x="810" y="670" text-anchor="middle" font-size="11.5" fill="#b45309">Container Station,</text>
  <text x="810" y="686" text-anchor="middle" font-size="11.5" fill="#b45309">not managed by this repo</text>

  <!-- Raspberry Pi 3 container (planned) -->
  <rect x="1000" y="315" width="300" height="460" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9,6"/>
  <text x="1022" y="341" font-size="15" font-weight="bold" fill="#334155">Raspberry Pi 3</text>
  <text x="1022" y="359" font-size="12" fill="#64748b">(planned &#8212; not yet built)</text>

  <!-- Pi-hole SECONDARY (planned) -->
  <rect x="1020" y="544" width="260" height="192" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8,5"/>
  <text x="1150" y="568" text-anchor="middle" font-size="15" font-weight="bold" fill="#78350f">Pi-hole</text>
  <text x="1150" y="587" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b45309">SECONDARY</text>
  <text x="1150" y="606" text-anchor="middle" font-size="12.5" fill="#78350f">IP: TBD</text>
  <text x="1150" y="625" text-anchor="middle" font-size="12" fill="#92400e">ad-blocking only</text>
  <text x="1150" y="643" text-anchor="middle" font-size="12" fill="#92400e">forwards homelab zone</text>
  <text x="1150" y="661" text-anchor="middle" font-size="12" fill="#92400e">to NS1 + NS2</text>
  <text x="1150" y="679" text-anchor="middle" font-size="11.5" fill="#b45309">(planned, not yet built)</text>

  <!-- All four long-distance connectors exit/enter from box BOTTOMS and arc
       through the open space below the containers, staggered at increasing
       depth (A shallowest, D deepest) so they don't cross through any box
       or collide with each other's labels. -->

  <!-- All connector lines drawn first, labels (with white backing) drawn
       after so no line can paint over another band's label. -->

  <!-- Band A: NS1 -> NS2 AXFR -->
  <path d="M 280,736 C 400,764 610,764 730,736" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arrow-dashed)"/>

  <!-- Band B: Pi-hole PRIMARY -> NS2 (conditional forward) -->
  <path d="M 475,736 C 560,800 765,800 850,736" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>

  <!-- Band C: Pi-hole SECONDARY -> NS1 (planned) -->
  <path d="M 1080,736 C 850,838 400,838 180,736" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>

  <!-- Short direct: Pi-hole SECONDARY -> NS2 (planned) -->
  <path d="M 1020,605 C 1000,605 965,605 947,605" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>

  <!-- Band D: Pi-hole PRIMARY -> SECONDARY gravity sync (planned) -->
  <path d="M 520,736 C 750,872 1000,872 1230,736" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-planned)"/>

  <!-- Labels, drawn last so they sit cleanly above every connector line -->
  <rect x="405" y="746" width="200" height="18" fill="#ffffff"/>
  <text x="505" y="759" text-anchor="middle" font-size="12.5" fill="#1d4ed8">AXFR zone transfer + NOTIFY</text>
  <rect x="425" y="789" width="475" height="18" fill="#ffffff"/>
  <text x="662" y="802" text-anchor="middle" font-size="12.5" fill="#1d4ed8">conditional forward: homelab.bcochofel.com (both Pi-holes -&gt; NS1 + NS2)</text>
  <rect x="785" y="866" width="180" height="18" fill="#ffffff"/>
  <text x="875" y="879" text-anchor="middle" font-size="12.5" fill="#475569">gravity sync (planned &#8212; TODO)</text>

  <!-- proxy VM -> QNAP (reverse proxy) -->
  <path d="M 590,410 C 615,405 625,400 650,398" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="618" y="385" text-anchor="middle" font-size="12" fill="#334155">reverse proxy</text>

  <!-- Legend -->
  <rect x="60" y="900" width="1240" height="140" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="924" font-size="13" font-weight="bold" fill="#334155">Legend</text>

  <line x1="82" y1="944" x2="122" y2="944" stroke="#334155" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="132" y="948" font-size="12.5" fill="#334155">network / traffic path</text>
  <line x1="82" y1="968" x2="122" y2="968" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-dashed)"/>
  <text x="132" y="972" font-size="12.5" fill="#334155">DNS-specific flow &#8212; already implemented (AXFR, conditional forward)</text>
  <line x1="82" y1="992" x2="122" y2="992" stroke="#64748b" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrow-planned)"/>
  <text x="132" y="996" font-size="12.5" fill="#334155">planned, not yet built (e.g. Pi-hole gravity sync)</text>

  <rect x="620" y="936" width="18" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="646" y="948" font-size="12.5" fill="#334155">CoreDNS &#8212; solid border = primary/authoritative, dashed = AXFR secondary</text>
  <rect x="620" y="960" width="18" height="14" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="646" y="972" font-size="12.5" fill="#334155">Pi-hole &#8212; solid = primary, dashed = secondary (planned); both ad-blocking only</text>
  <rect x="620" y="984" width="18" height="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="646" y="996" font-size="12.5" fill="#334155">Host/device dashed border = planned, not yet built</text>

</svg>
