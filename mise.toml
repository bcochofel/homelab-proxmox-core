# mise.toml — the single declaration of this repo's toolchain.
#
#   mise trust && mise install
#
# installs every pinned tool, creates .venv/, and (via the postinstall hook)
# runs `mise run bootstrap`: git hooks, commit template,
# TFLint plugins and the Ansible virtualenv + collections. The same file
# drives CI through jdx/mise-action, so local and CI run identical versions.
#
# Bumping a version: `mise run outdated`, edit the pin below, then `mise lock`
# and commit mise.toml, mise.lock and .mise/locks/ together. CI installs in
# locked mode (MISE_LOCKED=1), so a version change without `mise lock` fails
# CI. There's no Dependabot/Renovate for this file — bumps are deliberate.

[settings]
# Linux only (Ubuntu native or WSL2), see CONTRIBUTING.md.
lockfile_platforms = ["linux-x64"]

[tools]
# Pipeline: Packer -> Terraform -> Ansible (Ansible lives in .venv, below)
packer         = "1.16.0"
# IaC engine is OpenTofu (`tofu`) against the same HCP Terraform state;
# terraform stays pinned only as a rollback path — see docs/TERRAFORM.md.
opentofu       = "1.13.1"
terraform      = "1.15.8"
terramate      = "0.17.3"
# Lint / docs
tflint         = "0.64.0"
terraform-docs = "0.24.0"
# Policy as code / security
trivy          = "0.72.0"
gitleaks       = "8.30.1"
"pipx:checkov" = "3.3.22"
# Secrets: SOPS + age (see docs/CREDENTIALS.md)
sops           = "3.13.3"
age            = "1.3.2"
# Git hooks
"pipx:pre-commit" = "4.6.2"
# Runtimes: python for Ansible's .venv (ansible-core 2.20+, see
# requirements.txt), uv to install into it, node so pre-commit's node hooks
# (commitlint, markdownlint-cli2) use this pinned node.
python = "3.14.8"
uv     = "0.12.22"
node   = "24.21.0"

[env]
# Loaded automatically when you cd into the repo.
# Never put secrets here — see docs/CREDENTIALS.md for how they're passed.
# Ansible and ansible-lint live in .venv (requirements.txt), NOT as separate
# pipx tools: ansible-lint must see the same ansible-core and collections the
# playbooks run with.
_.python.venv = { path = ".venv", create = true }

[hooks]
# Runs after every `mise install`. Idempotent, so safe to re-run.
# MISE_SKIP_BOOTSTRAP=1 skips it, for CI jobs that need a single tool (the
# release workflow only needs node). Without the skip, `mise run bootstrap`
# auto-installs every tool its tasks use, even after `mise install node`.
postinstall = '[ -n "${MISE_SKIP_BOOTSTRAP:-}" ] || mise run bootstrap'

# ---------------------------------------------------------------------------
# Tasks: repo setup and checks, plus the credentialed Packer/OpenTofu
# commands (bottom of this file). `ansible-playbook` is not a task: it
# decrypts its own secrets and is run directly from ansible/.
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "One-time setup after clone (runs automatically after mise install)"
depends = ["setup:hooks", "setup:tflint", "setup:ansible"]
run = "echo 'bootstrap complete'"

[tasks."setup:hooks"]
description = "Install git hooks (pre-commit + commit-msg) and the commit template"
run = [
  "pre-commit install --install-hooks",
  "pre-commit install --hook-type commit-msg",
  "git config --local commit.template .gitmessage",
]

[tasks."setup:tflint"]
description = "Download TFLint rulesets declared in .tflint.hcl"
run = "tflint --init --config=.tflint.hcl"

[tasks."setup:ansible"]
description = "Install Ansible into .venv and its Galaxy collections"
run = [
  "uv pip install --quiet -r requirements.txt",
  "cd ansible && ansible-galaxy collection install -r requirements.yml",
]

[tasks.lint]
description = "Run every pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks.secrets]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

[tasks.check]
description = "Everything CI runs on a pull request"
depends = ["lint", "secrets"]

[tasks.doctor]
description = "Diagnose the local toolchain"
run = ["mise doctor", "mise ls --current"]

[tasks.outdated]
description = "Show which pinned tools and pre-commit hooks could be bumped"
run = ["mise outdated", "pre-commit autoupdate --dry-run || true"]

# ---------------------------------------------------------------------------
# Credentialed commands (docs/CREDENTIALS.md) — yours only; all of them are
# denied to the AI agent (.claude/settings.json).
#
# Your age key lives at ~/.config/sops/age/bcochofel.txt, deliberately NOT
# at SOPS's default keys.txt: SOPS reads the default file in every process
# (on top of SOPS_AGE_KEY_FILE), which would hand your key to anything the
# AI agent runs. Each task below passes it explicitly instead.
#
# Credentials reach one command through `sops exec-env`, so they exist only
# in that process — never in your shell. Keys in the two files are the
# environment variable names the tools read.
#   ~/.secrets/homelab.yaml     read-write: yours only
#   ~/.secrets/homelab-ro.yaml  read-only: yours and the ai-agent's
# ---------------------------------------------------------------------------

[tasks."packer:build"]
description = "Build the VM template (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/packer/ubuntu-26.04"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = [
  "packer init .",
  "sops exec-env ~/.secrets/homelab.yaml 'packer build .'",
]

[tasks."tofu:init"]
description = "Initialise OpenTofu against HCP Terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu init'"

[tasks."tofu:plan"]
description = "Plan as terraform, the one to review before applying (read-write)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu plan'"

[tasks."tofu:apply"]
description = "Apply as terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu apply'"

[tasks."ansible:site"]
description = "Configure every host (playbooks/site.yml); decrypts the inventory secrets with your key. Extra args after --"
dir = "{{config_root}}/ansible"
env = { ANSIBLE_SOPS_AGE_KEYFILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "ansible-playbook playbooks/site.yml"

[tasks.sops]
description = "Run sops with your key, from the current directory: mise run sops -- <file> | updatekeys <file>"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"

[tasks."secrets:check"]
description = "Check both ~/.secrets files open with the right key, and only with it (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
me="$HOME/.config/sops/age/bcochofel.txt"
agent="$HOME/.config/sops/age/ai-agent.txt"
rc=0
# expect <ok|refused> <label> <command...>: runs the command, never shows its output.
expect() {
  want=$1 label=$2; shift 2
  if "$@" >/dev/null 2>&1; then got=ok; else got=refused; fi
  if [ "$got" = "$want" ]; then echo "ok    $label ($got)"; else echo "FAIL  $label (expected $want, got $got)"; rc=1; fi
}
# Only the given key: an empty HOME hides any key at SOPS's default path.
with_key() { k=$1; shift; HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$k "$@"; }

expect ok      "homelab.yaml    opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/homelab.yaml"
expect ok      "homelab-ro.yaml opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/homelab-ro.yaml"
expect ok      "homelab-ro.yaml opens with the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/homelab-ro.yaml"
expect refused "homelab.yaml    refused to the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/homelab.yaml"
if [ -e "$HOME/.config/sops/age/keys.txt" ]; then
  echo "FAIL  a key exists at SOPS's default path ~/.config/sops/age/keys.txt (every process would use it)"; rc=1
else
  echo "ok    no key at SOPS's default path"
fi
exit $rc
'''
