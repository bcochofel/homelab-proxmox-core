# mise.toml — the single declaration of this repo's toolchain.
#
#   mise trust && mise install
#
# installs every pinned tool, creates .venv/, and (via the postinstall hook)
# runs `mise run bootstrap`: git hooks, commit template,
# TFLint plugins and the Ansible virtualenv + collections. The same file
# drives CI through jdx/mise-action, so local and CI run identical versions.
#
# Bumping a version: `mise run outdated`, edit the pin below, then `mise lock`
# and commit mise.toml, mise.lock and .mise/locks/ together. CI installs in
# locked mode (MISE_LOCKED=1), so a version change without `mise lock` fails
# CI. There's no Dependabot/Renovate for this file — bumps are deliberate.

[settings]
# Linux only (Ubuntu native or WSL2), see CONTRIBUTING.md.
lockfile_platforms = ["linux-x64"]

[tools]
# Pipeline: Packer -> Terraform -> Ansible (Ansible lives in .venv, below)
packer         = "1.16.0"
# IaC engine is OpenTofu (`tofu`) against the same HCP Terraform state;
# terraform stays pinned only as a rollback path — see docs/TERRAFORM.md.
opentofu       = "1.13.1"
terraform      = "1.15.8"
terramate      = "0.17.3"
# Lint / docs
tflint         = "0.64.0"
terraform-docs = "0.24.0"
# Policy as code / security
trivy          = "0.72.0"
gitleaks       = "8.30.1"
shellcheck     = "0.11.0"
"pipx:checkov" = "3.3.22"
# Secrets: SOPS + age (see docs/CREDENTIALS.md)
sops           = "3.13.3"
age            = "1.3.2"
# Git hooks
"pipx:pre-commit" = "4.6.2"
# Runtimes: python for Ansible's .venv (ansible-core 2.20+, see
# requirements.txt), uv to install into it, node so pre-commit's node hooks
# (commitlint, markdownlint-cli2) use this pinned node.
python = "3.14.8"
uv     = "0.12.22"
node   = "24.21.0"
# MCP servers for the AI agent (.mcp.json, docs/CREDENTIALS.md step 8).
# The Proxmox one isn't packaged: `mise run mcp:install` pins it instead.
"aqua:github/github-mcp-server"       = "1.14.0"
# HashiCorp ships this one on releases.hashicorp.com, not as GitHub release
# assets, so aqua can't resolve it: plain download, checksum from its
# SHA256SUMS file. Bumping it means updating version, url and checksum.
"http:terraform-mcp-server" = { version = "1.3.0", url = "https://releases.hashicorp.com/terraform-mcp-server/1.3.0/terraform-mcp-server_1.3.0_linux_amd64.zip", checksum = "sha256:f8ecdbfb8473af4d54f6ca428de59649ff4c74f1c8a904da1c2973fa345d4d26" }

[env]
# Loaded automatically when you cd into the repo.
# Never put secrets here — see docs/CREDENTIALS.md for how they're passed.
# Ansible and ansible-lint live in .venv (requirements.txt), NOT as separate
# pipx tools: ansible-lint must see the same ansible-core and collections the
# playbooks run with.
_.python.venv = { path = ".venv", create = true }

[hooks]
# Runs after every `mise install`. Idempotent, so safe to re-run.
# MISE_SKIP_BOOTSTRAP=1 skips it, for CI jobs that need a single tool (the
# release workflow only needs node). Without the skip, `mise run bootstrap`
# auto-installs every tool its tasks use, even after `mise install node`.
postinstall = '[ -n "${MISE_SKIP_BOOTSTRAP:-}" ] || mise run bootstrap'

# ---------------------------------------------------------------------------
# Tasks: repo setup and checks, plus the credentialed Packer/OpenTofu
# commands (bottom of this file). `ansible-playbook` is not a task: it
# decrypts its own secrets and is run directly from ansible/.
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "One-time setup after clone (runs automatically after mise install)"
depends = ["setup:hooks", "setup:tflint", "setup:ansible"]
run = "echo 'bootstrap complete'"

[tasks."setup:hooks"]
description = "Install git hooks (pre-commit + commit-msg) and the commit template"
run = [
  "pre-commit install --install-hooks",
  "pre-commit install --hook-type commit-msg",
  "git config --local commit.template .gitmessage",
]

[tasks."setup:tflint"]
description = "Download TFLint rulesets declared in .tflint.hcl"
run = "tflint --init --config=.tflint.hcl"

[tasks."setup:ansible"]
description = "Install Ansible into .venv and its Galaxy collections"
run = [
  "uv pip install --quiet -r requirements.txt",
  "cd ansible && ansible-galaxy collection install -r requirements.yml",
]

[tasks.lint]
description = "Run every pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks.secrets]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

[tasks.check]
description = "Everything CI runs on a pull request"
depends = ["lint", "secrets"]

[tasks.doctor]
description = "Diagnose the local toolchain"
run = ["mise doctor", "mise ls --current"]

[tasks.outdated]
description = "Show which pinned tools and pre-commit hooks could be bumped"
run = ["mise outdated", "pre-commit autoupdate --dry-run || true"]

# ---------------------------------------------------------------------------
# Credentialed commands (docs/CREDENTIALS.md) — yours only; all of them are
# denied to the AI agent (.claude/settings.json).
#
# Your age key lives at ~/.config/sops/age/bcochofel.txt, deliberately NOT
# at SOPS's default keys.txt: SOPS reads the default file in every process
# (on top of SOPS_AGE_KEY_FILE), which would hand your key to anything the
# AI agent runs. Each task below passes it explicitly instead.
#
# Credentials reach one command through `sops exec-env`, so they exist only
# in that process — never in your shell. Keys in the two files are the
# environment variable names the tools read.
#   ~/.secrets/homelab.yaml     read-write: yours only
#   ~/.secrets/homelab-ro.yaml  read-only: yours and the ai-agent's
# ---------------------------------------------------------------------------

[tasks."packer:build"]
description = "Build the VM template (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/packer/ubuntu-26.04"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = [
  "packer init .",
  "sops exec-env ~/.secrets/homelab.yaml 'packer build .'",
]

[tasks."tofu:init"]
description = "Initialise OpenTofu against HCP Terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu init'"

[tasks."tofu:plan"]
description = "Plan as terraform, the one to review before applying (read-write)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu plan'"

[tasks."tofu:apply"]
description = "Apply as terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu apply'"

[tasks."ansible:site"]
description = "Configure every host (playbooks/site.yml); decrypts the inventory secrets with your key. Extra args after --"
dir = "{{config_root}}/ansible"
env = { ANSIBLE_SOPS_AGE_KEYFILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "ansible-playbook playbooks/site.yml"

[tasks.sops]
description = "Run sops with your key, from the current directory: mise run sops -- <file> | updatekeys <file>"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"

[tasks."secrets:edit"]
description = "Edit a ~/.secrets file with your key, from ~/.secrets so its .sops.yaml applies: mise run secrets:edit -- homelab-ro.yaml"
dir = "{{env.HOME}}/.secrets"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"

[tasks."secrets:check"]
description = "Check both ~/.secrets files open with the right key, and only with it (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
me="$HOME/.config/sops/age/bcochofel.txt"
agent="$HOME/.config/sops/age/ai-agent.txt"
rc=0
# expect <ok|refused> <label> <command...>: runs the command, never shows its output.
expect() {
  want=$1 label=$2; shift 2
  if "$@" >/dev/null 2>&1; then got=ok; else got=refused; fi
  if [ "$got" = "$want" ]; then echo "ok    $label ($got)"; else echo "FAIL  $label (expected $want, got $got)"; rc=1; fi
}
# Only the given key: an empty HOME hides any key at SOPS's default path.
with_key() { k=$1; shift; HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$k "$@"; }

expect ok      "homelab.yaml    opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/homelab.yaml"
expect ok      "homelab-ro.yaml opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/homelab-ro.yaml"
expect ok      "homelab-ro.yaml opens with the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/homelab-ro.yaml"
expect refused "homelab.yaml    refused to the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/homelab.yaml"
if [ -e "$HOME/.config/sops/age/keys.txt" ]; then
  echo "FAIL  a key exists at SOPS's default path ~/.config/sops/age/keys.txt (every process would use it)"; rc=1
else
  echo "ok    no key at SOPS's default path"
fi
exit $rc
'''

[tasks."creds:check"]
description = "Check every credential authenticates, with one read-only API call each (prints ok/FAIL and HTTP status, never a value)"
shell = "bash -c"
run = '''
me="$HOME/.config/sops/age/bcochofel.txt"
agent="$HOME/.config/sops/age/ai-agent.txt"
rc=0
# Shared by every section below (each runs in its own `sops exec-env`; no
# single quotes allowed in here). Secrets reach curl through stdin
# (-H @-), never as command-line arguments. On failure, the API's own
# "message" fields are shown: they never contain the credential.
lib='
rc=0
present() { if [ -n "$2" ]; then echo "ok    $1 is set"; else echo "FAIL  $1 is missing or empty"; rc=1; fi; }
# check LABEL URL: reads the Authorization header from stdin, expects 200.
check() {
  body=$(mktemp)
  code=$(curl -sk -o "$body" -w "%{http_code}" -H @- "$2")
  if [ "$code" = 200 ]; then echo "ok    $1 (HTTP 200)"
  else
    msg=$(grep -o "\"message\": *\"[^\"]*\"" "$body" | head -2 | cut -d\" -f4 | paste -sd ";" -)
    echo "FAIL  $1 (HTTP $code, expected 200${msg:+: $msg})"; rc=1
  fi
  rm -f "$body"
}
'

echo "== ~/.secrets/homelab.yaml (your key)"
SOPS_AGE_KEY_FILE=$me sops exec-env "$HOME/.secrets/homelab.yaml" "bash -c '$lib"'
pve="${PKR_VAR_proxmox_api_url%/}"
check "Proxmox token packer@pve!packer" "$pve/version" < <(printf "Authorization: PVEAPIToken=%s=%s\n" "$PKR_VAR_proxmox_api_token_id" "$PKR_VAR_proxmox_api_token_secret")
check "Proxmox token terraform (TF_VAR_proxmox_api_token)" "$pve/version" < <(printf "Authorization: PVEAPIToken=%s\n" "$TF_VAR_proxmox_api_token")
check "HCP token, workspace homelab-bcochofel-com/core-caddy" https://app.terraform.io/api/v2/organizations/homelab-bcochofel-com/workspaces/core-caddy < <(printf "Authorization: Bearer %s\n" "$TF_TOKEN_app_terraform_io")
present PKR_VAR_password_hash "$PKR_VAR_password_hash"
present TF_VAR_cipassword "$TF_VAR_cipassword"
exit $rc'"'" || rc=1

echo "== ~/.secrets/homelab-ro.yaml (ai-agent key only)"
HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$agent sops exec-env "$HOME/.secrets/homelab-ro.yaml" "bash -c '$lib"'
check "Proxmox token ai-agent@pve!ai-agent" "https://$PROXMOX_HOST:$PROXMOX_PORT/api2/json/version" < <(printf "Authorization: PVEAPIToken=%s!%s=%s\n" "$PROXMOX_USER" "$PROXMOX_TOKEN_NAME" "$PROXMOX_TOKEN_VALUE")
present GITHUB_PERSONAL_ACCESS_TOKEN "$GITHUB_PERSONAL_ACCESS_TOKEN"
for repo in homelab-proxmox-core homelab-proxmox-workloads; do
  check "GitHub PAT, repo BCochofelHomelab/$repo" "https://api.github.com/repos/BCochofelHomelab/$repo" < <(printf "Authorization: Bearer %s\n" "$GITHUB_PERSONAL_ACCESS_TOKEN")
done
exit $rc'"'" || rc=1

echo "== ansible/inventory/group_vars/*.sops.yaml (your key)"
SOPS_AGE_KEY_FILE=$me sops exec-env "{{config_root}}/ansible/inventory/group_vars/caddy.sops.yaml" "bash -c '$lib"'
present cloudflare_api_token "$cloudflare_api_token"
check "Cloudflare token, zone bcochofel.com" "https://api.cloudflare.com/client/v4/zones?name=bcochofel.com" < <(printf "Authorization: Bearer %s\n" "$cloudflare_api_token")
exit $rc'"'" || rc=1
SOPS_AGE_KEY_FILE=$me sops exec-env "{{config_root}}/ansible/inventory/group_vars/pihole.sops.yaml" "bash -c '$lib"'
present pihole_webpassword "$pihole_webpassword"
exit $rc'"'" || rc=1

exit $rc
'''

[tasks."boundary:check"]
description = "Prove the AI agent's boundary using only the ai-agent key: WSL or devcontainer (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
agent="$HOME/.config/sops/age/ai-agent.txt"
ro="$HOME/.secrets/homelab-ro.yaml"
rc=0
ok()   { echo "ok    $1"; }
fail() { echo "FAIL  $1"; rc=1; }
# Only the ai-agent key: an empty HOME hides anything at SOPS's default key path.
as_agent() { HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$agent "$@"; }

if env | grep -qE '^(PKR_VAR_|TF_VAR_|TF_TOKEN_|PROXMOX_|GITHUB_PERSONAL)'; then
  fail "credentials are exported into this shell"; else ok "no credentials exported into this shell"; fi

if as_agent sops -d "$ro" >/dev/null 2>&1; then
  ok "ai-agent key opens homelab-ro.yaml"; else fail "ai-agent key can't open homelab-ro.yaml"; fi

for f in "$HOME/.secrets/homelab.yaml" \
         "{{config_root}}/ansible/inventory/group_vars/caddy.sops.yaml" \
         "{{config_root}}/ansible/inventory/group_vars/pihole.sops.yaml"; do
  name=${f#"{{config_root}}/"}; name=${name#"$HOME/"}
  if [ ! -e "$f" ]; then ok "$name not present"
  elif as_agent sops -d "$f" >/dev/null 2>&1; then fail "ai-agent key opens $name"
  else ok "ai-agent key refused by $name"; fi
done

n=$(as_agent sops exec-env "$ro" 'env | grep -c "^TF_"' 2>/dev/null)
if [ "$n" = "0" ]; then ok "homelab-ro.yaml holds no OpenTofu/HCP key"; else fail "homelab-ro.yaml holds TF_* keys (or couldn't be read)"; fi

# A harmless write (create a pool) as ai-agent must be refused.
code=$(as_agent sops exec-env "$ro" 'printf "Authorization: PVEAPIToken=%s!%s=%s\n" "$PROXMOX_USER" "$PROXMOX_TOKEN_NAME" "$PROXMOX_TOKEN_VALUE" | curl -sk -o /dev/null -w "%{http_code}" -H @- -X POST -d poolid=boundary-test "https://$PROXMOX_HOST:$PROXMOX_PORT/api2/json/pools"' 2>/dev/null)
case "$code" in
  403) ok "ai-agent Proxmox token can't write (HTTP 403)" ;;
  200) fail "ai-agent Proxmox token CAN write (HTTP 200): delete pool boundary-test, fix AiAgentRO" ;;
  *)   fail "Proxmox write check inconclusive (HTTP $code)" ;;
esac

if [ -e "$HOME/.config/sops/age/keys.txt" ]; then
  fail "a key exists at SOPS's default path ~/.config/sops/age/keys.txt"; else ok "no key at SOPS's default path"; fi

if [ -n "$REMOTE_CONTAINERS" ] || [ -f /.dockerenv ]; then
  echo "== devcontainer"
  [ -e "$HOME/.config/sops/age/bcochofel.txt" ] && fail "your age key is in the container" || ok "your age key isn't in the container"
  [ -e "$HOME/.secrets/homelab.yaml" ] && fail "homelab.yaml is in the container" || ok "homelab.yaml isn't in the container"
  [ -S /var/run/docker.sock ] && fail "the Docker socket is in the container" || ok "no Docker socket"
  # By content, not path: devcontainer.json points it at the host-home mount.
  [ -n "$SOPS_AGE_KEY_FILE" ] && cmp -s "$SOPS_AGE_KEY_FILE" "$agent" && ok "SOPS_AGE_KEY_FILE is the ai-agent key" || fail "SOPS_AGE_KEY_FILE isn't the ai-agent key"
fi
exit $rc
'''

[tasks."mcp:install"]
description = "Install the Proxmox MCP server at its pinned commit into ~/.local/share/mcp-proxmox"
shell = "bash -c"
run = '''
set -euo pipefail
# Not published to npm: pin a commit you've reviewed. To bump it, review
# the diff (git -C ~/.local/share/mcp-proxmox log -p <old>..<new>) first.
rev=6186c715b5ff393adc9fdf597a791c35bc2f90c7
dir="$HOME/.local/share/mcp-proxmox"
[ -d "$dir/.git" ] || git clone -q https://github.com/gilby125/mcp-proxmox "$dir"
git -C "$dir" fetch -q origin
git -C "$dir" checkout -q "$rev"
# No package-lock.json upstream, so `npm install`, not `npm ci`.
cd "$dir" && npm install --omit=dev --ignore-scripts --no-audit --no-fund --silent
echo "Proxmox MCP server at $rev in $dir"
# Where the MCP servers write their logs (.mcp.json: terraform-mcp-server --log-file).
mkdir -p "$HOME/.local/state/mcp"
'''
