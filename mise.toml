# mise.toml — the single declaration of this repo's toolchain.
#
#   mise trust && mise install
#
# installs every pinned tool, creates .venv/, and (via the postinstall hook)
# runs `mise run bootstrap`: git hooks, commit template,
# TFLint plugins and the Ansible virtualenv + collections. The same file
# drives CI through jdx/mise-action, so local and CI run identical versions.
#
# Bumping a version: `mise run outdated`, edit the pin below, then `mise lock`
# and commit mise.toml, mise.lock and .mise/locks/ together. CI installs in
# locked mode (MISE_LOCKED=1), so a version change without `mise lock` fails
# CI. There's no Dependabot/Renovate for this file — bumps are deliberate.

[settings]
# Linux only (Ubuntu native or WSL2), see CONTRIBUTING.md.
lockfile_platforms = ["linux-x64"]

[tools]
# Pipeline: Packer -> Terraform -> Ansible (Ansible lives in .venv, below)
packer         = "1.16.0"
# IaC engine is OpenTofu (`tofu`) against the same HCP Terraform state;
# terraform stays pinned only as a rollback path — see docs/TERRAFORM.md.
opentofu       = "1.13.1"
terraform      = "1.15.8"
terramate      = "0.17.3"
# Lint / docs
tflint         = "0.64.0"
terraform-docs = "0.24.0"
# Policy as code / security
trivy          = "0.72.0"
gitleaks       = "8.30.1"
shellcheck     = "0.11.0"
# GitHub Actions workflows: actionlint (syntax, expressions, shellcheck on
# run: steps) and zizmor (security: injection, permissions, pinning).
actionlint     = "1.7.12"
zizmor         = "1.30.1"
"pipx:checkov" = "3.3.22"
# Secrets: SOPS + age (see docs/CREDENTIALS.md)
sops           = "3.13.3"
age            = "1.3.2"
# Git hooks
"pipx:pre-commit" = "4.6.2"
# GitHub CLI. In the devcontainer it runs as the AI agent's machine user,
# through the wrapper in .devcontainer/bin (docs/DEVCONTAINER.md).
gh             = "2.102.0"
# Runtimes: python for Ansible's .venv (ansible-core 2.20+, see
# requirements.txt), uv to install into it, node so pre-commit's node hooks
# (commitlint, markdownlint-cli2) use this pinned node.
python = "3.14.8"
uv     = "0.12.22"
node   = "24.21.0"
# MCP servers for the AI agent (.mcp.json, docs/CREDENTIALS.md step 8).
# The Proxmox one isn't packaged: `mise run mcp:install` pins it instead.
"aqua:github/github-mcp-server"       = "1.14.0"
# HashiCorp ships this one on releases.hashicorp.com, not as GitHub release
# assets, so aqua can't resolve it: plain download, checksum from its
# SHA256SUMS file. Bumping it means updating version, url and checksum.
"http:terraform-mcp-server" = { version = "1.3.0", url = "https://releases.hashicorp.com/terraform-mcp-server/1.3.0/terraform-mcp-server_1.3.0_linux_amd64.zip", checksum = "sha256:f8ecdbfb8473af4d54f6ca428de59649ff4c74f1c8a904da1c2973fa345d4d26" }

[env]
# Loaded automatically when you cd into the repo.
# Never put secrets here — see docs/CREDENTIALS.md for how they're passed.
# Ansible and ansible-lint live in .venv (requirements.txt), NOT as separate
# pipx tools: ansible-lint must see the same ansible-core and collections the
# playbooks run with.
_.python.venv = { path = ".venv", create = true }

[hooks]
# Runs after every `mise install`. Idempotent, so safe to re-run.
# MISE_SKIP_BOOTSTRAP=1 skips it, for CI jobs that need a single tool (the
# release workflow only needs node). Without the skip, `mise run bootstrap`
# auto-installs every tool its tasks use, even after `mise install node`.
postinstall = '[ -n "${MISE_SKIP_BOOTSTRAP:-}" ] || mise run bootstrap'

# ---------------------------------------------------------------------------
# Tasks: repo setup and checks, plus the credentialed Packer/OpenTofu
# commands (bottom of this file). `ansible-playbook` is not a task: it
# decrypts its own secrets and is run directly from ansible/.
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "One-time setup after clone (runs automatically after mise install)"
depends = ["setup:hooks", "setup:tflint", "setup:ansible"]
run = "echo 'bootstrap complete'"

[tasks."setup:hooks"]
description = "Install git hooks (pre-commit + commit-msg) and the commit template"
run = [
  "pre-commit install --install-hooks",
  "pre-commit install --hook-type commit-msg",
  "git config --local commit.template .gitmessage",
]

[tasks."setup:tflint"]
description = "Download TFLint rulesets declared in .tflint.hcl"
run = "tflint --init --config=.tflint.hcl"

[tasks."setup:ansible"]
description = "Install Ansible into .venv and its Galaxy collections"
run = [
  "uv pip install --quiet -r requirements.txt",
  "cd ansible && ansible-galaxy collection install -r requirements.yml",
]

[tasks.lint]
description = "Run every pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks.secrets]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

[tasks.check]
description = "Everything CI runs on a pull request"
depends = ["lint", "secrets"]

[tasks.doctor]
description = "Diagnose the local toolchain"
run = ["mise doctor", "mise ls --current"]

[tasks.outdated]
description = "Show which pinned tools and pre-commit hooks could be bumped"
run = ["mise outdated", "pre-commit autoupdate --dry-run || true"]

# ---------------------------------------------------------------------------
# Credentialed commands (docs/CREDENTIALS.md) — yours only; all of them are
# denied to the AI agent (.claude/settings.json).
#
# Your age key lives at ~/.config/sops/age/bcochofel.txt, deliberately NOT
# at SOPS's default keys.txt: SOPS reads the default file in every process
# (on top of SOPS_AGE_KEY_FILE), which would hand your key to anything the
# AI agent runs. Each task below passes it explicitly instead.
#
# Credentials reach one command through `sops exec-env`, so they exist only
# in that process — never in your shell. Keys in the two files are the
# environment variable names the tools read.
#   ~/.secrets/homelab.yaml     read-write: yours only
#   ~/.secrets/homelab-ro.yaml  read-only: yours and the ai-agent's
# ---------------------------------------------------------------------------

[tasks."packer:build"]
description = "Build the VM template (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/packer/ubuntu-26.04"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = [
  "packer init .",
  "sops exec-env ~/.secrets/homelab.yaml 'packer build .'",
]

[tasks."tofu:init"]
description = "Initialise OpenTofu against HCP Terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu init'"

[tasks."tofu:plan"]
description = "Plan as terraform and save it to terraform/tfplan, the one to review before applying (read-write)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu plan -out=tfplan'"

# Applies the plan saved by tofu:plan: no confirmation prompt, and tofu
# refuses a plan that's stale against the current state.
[tasks."tofu:apply"]
description = "Apply terraform/tfplan, saved by tofu:plan, as terraform (read-write: ~/.secrets/homelab.yaml)"
dir = "{{config_root}}/terraform"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
run = "sops exec-env ~/.secrets/homelab.yaml 'tofu apply tfplan'"

[tasks."ansible:site"]
description = "Configure every host (playbooks/site.yml); decrypts the inventory secrets with your key. Extra args after --"
dir = "{{config_root}}/ansible"
env = { ANSIBLE_SOPS_AGE_KEYFILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "ansible-playbook playbooks/site.yml"

[tasks."ansible:runner"]
description = "Install and register the GitHub Actions runner (playbooks/30-github-runner.yml, not in site.yml); asks for the registration token. Extra args after --"
dir = "{{config_root}}/ansible"
env = { ANSIBLE_SOPS_AGE_KEYFILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "ansible-playbook playbooks/30-github-runner.yml"

[tasks."tofu:plan-ci"]
description = "Plan as ci, the dry-run runner's identity (ci/dry-run.sops.yaml with the ci key), without refreshing; never saves a plan"
dir = "{{config_root}}/terraform"
shell = "bash -c"
run = '''
# The ci key: in CI it's SOPS_AGE_KEY (the dry-run environment's CI_AGE_KEY
# secret, never written to disk); on your machine, its file.
[ -n "$SOPS_AGE_KEY" ] || export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/ci.txt"
# -refresh=false: refreshing a VM reads its disks' volume info, which
# Proxmox only allows with VM.Config.Disk, a write privilege ci@pve!plan
# doesn't have (docs/SETUP.md). The plan compares the code with the state.
sops exec-env ../ci/dry-run.sops.yaml 'tofu init -input=false -no-color >/dev/null && tofu plan -refresh=false -input=false -no-color -lock-timeout=5m'
'''

[tasks."ansible:check"]
description = "Dry-run site.yml as ci (--check --diff): the ci key, the automation SSH key and the inventory from the OpenTofu state; never on runner01. Extra args after --"
dir = "{{config_root}}/ansible"
shell = "bash -c"
run = '''
set -eo pipefail
[ -n "$SOPS_AGE_KEY" ] || export SOPS_AGE_KEY_FILE="$HOME/.config/sops/age/ci.txt" ANSIBLE_SOPS_AGE_KEYFILE="$HOME/.config/sops/age/ci.txt"
# The automation key exists only in this directory, for this run.
tmp=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ansible-check.XXXXXX")
trap 'rm -rf "$tmp"' EXIT
sops decrypt --input-type binary --output-type binary ../ci/ssh_ed25519.key.sops >"$tmp/ssh_key"
chmod 600 "$tmp/ssh_key"
# hosts.ini is gitignored: the same file tofu apply writes, from the state.
(cd ../terraform && sops exec-env ../ci/dry-run.sops.yaml 'tofu init -input=false -no-color >/dev/null && tofu output -raw ansible_inventory') >"$tmp/hosts.ini"
install -m 0644 "$tmp/hosts.ini" inventory/hosts.ini
ANSIBLE_PRIVATE_KEY_FILE="$tmp/ssh_key" ansible-playbook playbooks/site.yml --check --diff --limit '!github_runner''''

[tasks.sops]
description = "Run sops with your key, from the current directory: mise run sops -- <file> | updatekeys <file>"
dir = "{{cwd}}"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"

[tasks."secrets:edit"]
description = "Edit a ~/.secrets file with your key, from ~/.secrets so its .sops.yaml applies: mise run secrets:edit -- homelab-ro.yaml"
dir = "{{env.HOME}}/.secrets"
env = { SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/bcochofel.txt" }
raw = true
run = "sops"

[tasks."secrets:check"]
description = "Check every ~/.secrets file opens with the right key, and only with it (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
me="$HOME/.config/sops/age/bcochofel.txt"
agent="$HOME/.config/sops/age/ai-agent.txt"
rc=0
# expect <ok|refused> <label> <command...>: runs the command, never shows its output.
expect() {
  want=$1 label=$2; shift 2
  if "$@" >/dev/null 2>&1; then got=ok; else got=refused; fi
  if [ "$got" = "$want" ]; then echo "ok    $label ($got)"; else echo "FAIL  $label (expected $want, got $got)"; rc=1; fi
}
# Only the given key: an empty HOME hides any key at SOPS's default path.
with_key() { k=$1; shift; HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$k "$@"; }

expect ok      "homelab.yaml    opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/homelab.yaml"
expect ok      "homelab-ro.yaml opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/homelab-ro.yaml"
expect ok      "homelab-ro.yaml opens with the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/homelab-ro.yaml"
expect refused "homelab.yaml    refused to the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/homelab.yaml"
expect ok      "ai-agent-git.yaml opens with your key"        with_key "$me"    sops -d "$HOME/.secrets/ai-agent-git.yaml"
expect ok      "ai-agent-git.yaml opens with the ai-agent key" with_key "$agent" sops -d "$HOME/.secrets/ai-agent-git.yaml"
if [ -e "$HOME/.config/sops/age/keys.txt" ]; then
  echo "FAIL  a key exists at SOPS's default path ~/.config/sops/age/keys.txt (every process would use it)"; rc=1
else
  echo "ok    no key at SOPS's default path"
fi
exit $rc
'''

[tasks."creds:check"]
description = "Check every credential authenticates, with one read-only API call each (prints ok/FAIL and HTTP status, never a value)"
shell = "bash -c"
run = '''
me="$HOME/.config/sops/age/bcochofel.txt"
agent="$HOME/.config/sops/age/ai-agent.txt"
rc=0
# Shared by every section below (each runs in its own `sops exec-env`; no
# single quotes allowed in here). Secrets reach curl through stdin
# (-H @-), never as command-line arguments. On failure, the API's own
# "message" fields are shown: they never contain the credential.
lib='
rc=0
present() { if [ -n "$2" ]; then echo "ok    $1 is set"; else echo "FAIL  $1 is missing or empty"; rc=1; fi; }
# check LABEL URL: reads the Authorization header from stdin, expects 200.
check() {
  body=$(mktemp)
  code=$(curl -sk -o "$body" -w "%{http_code}" -H @- "$2")
  if [ "$code" = 200 ]; then echo "ok    $1 (HTTP 200)"
  else
    msg=$(grep -o "\"message\": *\"[^\"]*\"" "$body" | head -2 | cut -d\" -f4 | paste -sd ";" -)
    echo "FAIL  $1 (HTTP $code, expected 200${msg:+: $msg})"; rc=1
  fi
  rm -f "$body"
}
'

echo "== ~/.secrets/homelab.yaml (your key)"
SOPS_AGE_KEY_FILE=$me sops exec-env "$HOME/.secrets/homelab.yaml" "bash -c '$lib"'
pve="${PKR_VAR_proxmox_api_url%/}"
check "Proxmox token packer@pve!packer" "$pve/version" < <(printf "Authorization: PVEAPIToken=%s=%s\n" "$PKR_VAR_proxmox_api_token_id" "$PKR_VAR_proxmox_api_token_secret")
check "Proxmox token terraform (TF_VAR_proxmox_api_token)" "$pve/version" < <(printf "Authorization: PVEAPIToken=%s\n" "$TF_VAR_proxmox_api_token")
check "HCP token, workspace homelab-bcochofel-com/core-caddy" https://app.terraform.io/api/v2/organizations/homelab-bcochofel-com/workspaces/core-caddy < <(printf "Authorization: Bearer %s\n" "$TF_TOKEN_app_terraform_io")
present PKR_VAR_password_hash "$PKR_VAR_password_hash"
present TF_VAR_cipassword "$TF_VAR_cipassword"
exit $rc'"'" || rc=1

echo "== ~/.secrets/homelab-ro.yaml (ai-agent key only)"
HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$agent sops exec-env "$HOME/.secrets/homelab-ro.yaml" "bash -c '$lib"'
check "Proxmox token ai-agent@pve!ai-agent" "https://$PROXMOX_HOST:$PROXMOX_PORT/api2/json/version" < <(printf "Authorization: PVEAPIToken=%s!%s=%s\n" "$PROXMOX_USER" "$PROXMOX_TOKEN_NAME" "$PROXMOX_TOKEN_VALUE")
present GITHUB_PERSONAL_ACCESS_TOKEN "$GITHUB_PERSONAL_ACCESS_TOKEN"
for repo in homelab-proxmox-core homelab-proxmox-workloads; do
  check "GitHub PAT, repo BCochofelHomelab/$repo" "https://api.github.com/repos/BCochofelHomelab/$repo" < <(printf "Authorization: Bearer %s\n" "$GITHUB_PERSONAL_ACCESS_TOKEN")
done
exit $rc'"'" || rc=1

echo "== ~/.secrets/ai-agent-git.yaml (ai-agent key only)"
HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$agent sops exec-env "$HOME/.secrets/ai-agent-git.yaml" "bash -c '$lib"'
auth() { printf "Authorization: Bearer %s\n" "$GH_TOKEN"; }
# field NAME: the first JSON field NAME in the response on stdin (strings unquoted).
field() { grep -o "\"$1\": *[^,}]*" | head -1 | sed "s/^[^:]*: *//; s/\"//g"; }
login=$(auth | curl -s -H @- https://api.github.com/user | field login)
if [ "$login" = bcochofel-ai-agent ]; then echo "ok    GitHub PAT is bcochofel-ai-agent"
else echo "FAIL  GitHub PAT is ${login:-not valid}, expected bcochofel-ai-agent"; rc=1; fi
for repo in homelab-proxmox-core homelab-proxmox-workloads; do
  perms=$(auth | curl -s -H @- "https://api.github.com/repos/BCochofelHomelab/$repo")
  push=$(field push <<<"$perms") admin=$(field admin <<<"$perms")
  if [ "$push" = true ] && [ "$admin" = false ]; then echo "ok    bcochofel-ai-agent can push to $repo, not administer it"
  else echo "FAIL  bcochofel-ai-agent on $repo: push=${push:-?} admin=${admin:-?}, expected push=true admin=false"; rc=1; fi
done
exit $rc'"'" || rc=1

echo "== ansible/inventory/group_vars/*.sops.yaml (your key)"
SOPS_AGE_KEY_FILE=$me sops exec-env "{{config_root}}/ansible/inventory/group_vars/caddy.sops.yaml" "bash -c '$lib"'
present cloudflare_api_token "$cloudflare_api_token"
check "Cloudflare token, zone bcochofel.com" "https://api.cloudflare.com/client/v4/zones?name=bcochofel.com" < <(printf "Authorization: Bearer %s\n" "$cloudflare_api_token")
exit $rc'"'" || rc=1
SOPS_AGE_KEY_FILE=$me sops exec-env "{{config_root}}/ansible/inventory/group_vars/pihole.sops.yaml" "bash -c '$lib"'
present pihole_webpassword "$pihole_webpassword"
exit $rc'"'" || rc=1
# Fleet enrollment tokens (a map, so no exec-env): it opens with your key.
f="{{config_root}}/ansible/inventory/group_vars/all.sops.yaml"
if [ ! -e "$f" ]; then echo "ok    all.sops.yaml not present yet"
elif SOPS_AGE_KEY_FILE=$me sops -d "$f" >/dev/null 2>&1; then echo "ok    all.sops.yaml opens with your key"
else echo "FAIL  all.sops.yaml doesn't open with your key"; rc=1; fi

echo "== ci/ (the ci key only: the dry-run runner's credentials, docs/SETUP.md)"
ci="$HOME/.config/sops/age/ci.txt"
if [ ! -e "{{config_root}}/ci/dry-run.sops.yaml" ]; then echo "ok    ci/dry-run.sops.yaml not present yet"
else
HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$ci sops exec-env "{{config_root}}/ci/dry-run.sops.yaml" "bash -c '$lib"'
check "Proxmox token ci@pve!plan (TF_VAR_proxmox_api_token)" "https://192.168.68.20:8006/api2/json/version" < <(printf "Authorization: PVEAPIToken=%s\n" "$TF_VAR_proxmox_api_token")
check "HCP team token, workspace homelab-bcochofel-com/core-caddy" https://app.terraform.io/api/v2/organizations/homelab-bcochofel-com/workspaces/core-caddy < <(printf "Authorization: Bearer %s\n" "$TF_TOKEN_app_terraform_io")
present TF_VAR_cipassword "$TF_VAR_cipassword"
exit $rc'"'" || rc=1
fi
# The automation key opens with the ci key and is the one the hosts trust.
f="{{config_root}}/ci/ssh_ed25519.key.sops"
want=$(sed -n 's/^ci_ssh_public_key: "\(ssh-ed25519 [^ ]*\).*/\1/p' "{{config_root}}/ansible/roles/ci_ssh_key/defaults/main.yml")
if [ ! -e "$f" ]; then echo "ok    ci/ssh_ed25519.key.sops not present yet"
else
  got=$(HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$ci sops decrypt --input-type binary --output-type binary "$f" 2>/dev/null |
        ssh-keygen -y -f /dev/stdin 2>/dev/null | cut -d' ' -f1-2)
  [ -n "$got" ] && [ "$got" = "$want" ] && echo "ok    ci/ssh_ed25519.key.sops opens with the ci key and matches ci_ssh_public_key" ||
    { echo "FAIL  ci/ssh_ed25519.key.sops doesn't open with the ci key, or isn't ci_ssh_public_key's pair"; rc=1; }
fi
# ansible:check reads the inventory secrets with the ci key.
for f in "{{config_root}}"/ansible/inventory/group_vars/*.sops.yaml; do
  [ -e "$f" ] || continue
  name=${f#"{{config_root}}/"}
  if HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$ci sops -d "$f" >/dev/null 2>&1; then echo "ok    $name opens with the ci key"
  else echo "FAIL  $name doesn't open with the ci key (mise run sops -- updatekeys $name)"; rc=1; fi
done

exit $rc
'''

[tasks."boundary:check"]
description = "Prove the AI agent's boundary using only the ai-agent key: WSL or devcontainer (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
agent="$HOME/.config/sops/age/ai-agent.txt"
ro="$HOME/.secrets/homelab-ro.yaml"
rc=0
ok()   { echo "ok    $1"; }
fail() { echo "FAIL  $1"; rc=1; }
# Only the ai-agent key: an empty HOME hides anything at SOPS's default key path.
as_agent() { HOME=$(mktemp -d) SOPS_AGE_KEY_FILE=$agent "$@"; }

if env | grep -qE '^(PKR_VAR_|TF_VAR_|TF_TOKEN_|PROXMOX_|GITHUB_PERSONAL)'; then
  fail "credentials are exported into this shell"; else ok "no credentials exported into this shell"; fi

if as_agent sops -d "$ro" >/dev/null 2>&1; then
  ok "ai-agent key opens homelab-ro.yaml"; else fail "ai-agent key can't open homelab-ro.yaml"; fi

for f in "$HOME/.secrets/homelab.yaml" \
         "{{config_root}}/ansible/inventory/group_vars/caddy.sops.yaml" \
         "{{config_root}}/ansible/inventory/group_vars/pihole.sops.yaml" \
         "{{config_root}}/ansible/inventory/group_vars/all.sops.yaml" \
         "{{config_root}}/ci/dry-run.sops.yaml" \
         "{{config_root}}/ci/ssh_ed25519.key.sops"; do
  name=${f#"{{config_root}}/"}; name=${name#"$HOME/"}
  if [ ! -e "$f" ]; then ok "$name not present"
  elif as_agent sops -d "$f" >/dev/null 2>&1; then fail "ai-agent key opens $name"
  else ok "ai-agent key refused by $name"; fi
done

n=$(as_agent sops exec-env "$ro" 'env | grep -c "^TF_"' 2>/dev/null)
if [ "$n" = "0" ]; then ok "homelab-ro.yaml holds no OpenTofu/HCP key"; else fail "homelab-ro.yaml holds TF_* keys (or couldn't be read)"; fi

# A harmless write (create a pool) as ai-agent must be refused.
code=$(as_agent sops exec-env "$ro" 'printf "Authorization: PVEAPIToken=%s!%s=%s\n" "$PROXMOX_USER" "$PROXMOX_TOKEN_NAME" "$PROXMOX_TOKEN_VALUE" | curl -sk -o /dev/null -w "%{http_code}" -H @- -X POST -d poolid=boundary-test "https://$PROXMOX_HOST:$PROXMOX_PORT/api2/json/pools"' 2>/dev/null)
case "$code" in
  403) ok "ai-agent Proxmox token can't write (HTTP 403)" ;;
  200) fail "ai-agent Proxmox token CAN write (HTTP 200): delete pool boundary-test, fix AiAgentRO" ;;
  *)   fail "Proxmox write check inconclusive (HTTP $code)" ;;
esac

if [ -e "$HOME/.config/sops/age/keys.txt" ]; then
  fail "a key exists at SOPS's default path ~/.config/sops/age/keys.txt"; else ok "no key at SOPS's default path"; fi

# The AI agent on WSL can write .git/config, and git runs code from some of
# its keys (or redirects remotes, or pulls in other files).
risky=$(git config --local --get-regexp '^(core\.(hookspath|fsmonitor|sshcommand|pager|editor|askpass|gitproxy)|credential\..*|filter\..*|diff\..*|merge\..*\.driver|sequence\.editor|gpg\..*|include\..*|includeif\..*|url\..*|alias\..*)$' |
  awk '$1 !~ /^alias\./ || $2 ~ /^!/ {print $1}' | sort -u | paste -sd' ' -)
[ -z "$risky" ] && ok ".git/config sets nothing that runs code or redirects remotes" ||
  fail ".git/config sets $risky: check them before using git on WSL"

# The machine user is in sre-team: neither may own a path, or its approval would count.
if grep -vE '^\s*(#|$)' "{{config_root}}/.github/CODEOWNERS" | grep -qiE 'bcochofel-ai-agent|sre-team'; then
  fail "CODEOWNERS names bcochofel-ai-agent or sre-team"; else ok "CODEOWNERS names neither bcochofel-ai-agent nor sre-team"; fi

if [ -n "$REMOTE_CONTAINERS" ] || [ -f /.dockerenv ]; then
  echo "== devcontainer"
  [ -e "$HOME/.config/sops/age/bcochofel.txt" ] && fail "your age key is in the container" || ok "your age key isn't in the container"
  [ -e "$HOME/.secrets/homelab.yaml" ] && fail "homelab.yaml is in the container" || ok "homelab.yaml isn't in the container"
  [ -S /var/run/docker.sock ] && fail "the Docker socket is in the container" || ok "no Docker socket"
  # Under the container's home and under the host-home path the ai-agent key is mounted at.
  if [ -e "$HOME/.config/sops/age/ci.txt" ] || [ -e "${SOPS_AGE_KEY_FILE%/*}/ci.txt" ] || [ -n "$SOPS_AGE_KEY" ]; then
    fail "a ci key is in the container"; else ok "no ci key in the container"; fi
  # By content, not path: devcontainer.json points it at the host-home mount.
  [ -n "$SOPS_AGE_KEY_FILE" ] && cmp -s "$SOPS_AGE_KEY_FILE" "$agent" && ok "SOPS_AGE_KEY_FILE is the ai-agent key" || fail "SOPS_AGE_KEY_FILE isn't the ai-agent key"

  echo "== devcontainer: git and GitHub act as the AI agent"
  if [ -z "$SSH_AUTH_SOCK" ] && ! ssh-add -l >/dev/null 2>&1; then
    ok "no ssh-agent forwarded"; else fail "an ssh-agent is reachable (SSH_AUTH_SOCK=$SSH_AUTH_SOCK)"; fi
  # Any helper other than the agent's would answer for a host that isn't github.com.
  if printf 'protocol=https\nhost=example.com\n\n' |
     GIT_TERMINAL_PROMPT=0 GIT_ASKPASS= SSH_ASKPASS= git credential fill >/dev/null 2>&1; then
    fail "another git credential helper answers (VS Code's?)"; else ok "no git credential helper but the agent's"; fi
  [ "$(git config user.email)" = 340075370+bcochofel-ai-agent@users.noreply.github.com ] &&
    ok "commits are authored by bcochofel-ai-agent" || fail "commit identity is $(git config user.email)"
  [ "$(git config core.hooksPath)" = "{{config_root}}/.devcontainer/git-hooks" ] &&
    ok "git hooks come from .devcontainer/git-hooks" || fail "core.hooksPath isn't .devcontainer/git-hooks"
  # An empty entry resets the list (devcontainer.json's drops VS Code's, from
  # ~/.gitconfig): only the entries after the last one are in effect.
  helpers=$(git config --get-all credential.helper | awk '/^$/ {h = ""; next} {h = h ? h " " $0 : $0} END {print h}')
  [ "$helpers" = "{{config_root}}/.devcontainer/bin/git-credential-ai-agent" ] &&
    ok "the only credential.helper is the agent's" || fail "credential.helper is: ${helpers:-none}"
  # The agent's own WSL clone, never yours: the path inside the mounted filesystem.
  src=$(findmnt -no FSROOT -T "{{config_root}}")
  case "$src" in
    "") fail "can't tell where the working copy is mounted from" ;;
    */Projects/GitHub/BCochofelHomelab/homelab-proxmox-core) fail "the working copy is your clone, $src" ;;
    *) ok "the working copy isn't your clone (mounted from $src)" ;;
  esac
  for sh in bash zsh; do
    command -v $sh >/dev/null || continue
    [ "$($sh -ic 'command -v gh' 2>/dev/null | tail -1)" = "{{config_root}}/.devcontainer/bin/gh" ] &&
      ok "gh in $sh is the agent's wrapper" || fail "gh in $sh isn't .devcontainer/bin/gh"
  done
  login=$("{{config_root}}/.devcontainer/bin/gh" api user --jq .login 2>/dev/null)
  [ "$login" = bcochofel-ai-agent ] && ok "gh authenticates as bcochofel-ai-agent" || fail "gh authenticates as ${login:-nobody}"
  # A dry-run push authenticates (a fetch from a public repo wouldn't) and sends nothing.
  if git push --dry-run origin HEAD:refs/heads/boundary-check >/dev/null 2>&1; then
    ok "git authenticates to origin over HTTPS with the agent's PAT"; else fail "git can't authenticate to origin"; fi
  repo=$(git remote get-url origin | sed -E 's#^.*github\.com[:/]##; s#\.git$##')
  n=$("{{config_root}}/.devcontainer/bin/gh" api "repos/$repo/rules/branches/main" \
      --jq '[.[] | select(.type == "pull_request") | .parameters | select(.required_approving_review_count >= 1 and .require_code_owner_review)] | length' 2>/dev/null)
  [ "${n:-0}" -ge 1 ] && ok "main requires a code owner's approval, for the agent too" ||
    fail "main's rules for the agent lack a required code-owner approval"
  # A commit that adds a workflow, built without touching the working copy;
  # the PAT has no Workflows permission, so GitHub must refuse it.
  idx=$(mktemp)
  GIT_INDEX_FILE=$idx git read-tree HEAD
  blob=$(echo "# boundary:check" | git hash-object -w --stdin)
  GIT_INDEX_FILE=$idx git update-index --add --cacheinfo "100644,$blob,.github/workflows/boundary-check.yml"
  commit=$(git commit-tree "$(GIT_INDEX_FILE=$idx git write-tree)" -p HEAD -m "boundary:check workflow push")
  rm -f "$idx"
  if out=$(git push origin "$commit:refs/heads/boundary-check-workflows" 2>&1); then
    git push -q origin --delete boundary-check-workflows
    fail "the agent pushed a workflow change (branch deleted): its PAT has the Workflows permission"
  elif echo "$out" | grep -qi workflow; then ok "a push touching .github/workflows/ is refused"
  else fail "workflow push check inconclusive: $(echo "$out" | tail -1)"; fi
fi
exit $rc
'''

[tasks."runner:check"]
description = "Prove the GitHub Actions runner's limits on runner01, over SSH as you (prints ok/FAIL, never a value)"
shell = "bash -c"
run = '''
# accept-new: records runner01's host key on first contact (Ansible never
# does, host_key_checking = False) and still refuses one that changes.
ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new ubuntu@runner01.homelab.bcochofel.com 'sudo bash -s' <<'EOF'
rc=0
ok()   { echo "ok    $1"; }
fail() { echo "FAIL  $1"; rc=1; }
u=gha-runner dir=/opt/actions-runner

id "$u" >/dev/null 2>&1 && ok "user $u exists" || fail "no user $u"
sudo -u "$u" sudo -n true >/dev/null 2>&1 && fail "$u can sudo" || ok "$u can't sudo"
id -nG "$u" 2>/dev/null | tr ' ' '\n' | grep -qx docker && fail "$u is in the docker group" || ok "$u isn't in the docker group"
for unit in docker.socket docker.service; do
  [ "$(systemctl is-enabled "$unit" 2>/dev/null)" = masked ] && ! systemctl is-active -q "$unit" &&
    ok "$unit is masked and stopped" || fail "$unit isn't masked and stopped"
done
[ -S /var/run/docker.sock ] && fail "a Docker socket exists" || ok "no Docker socket"
# An age private key anywhere but a job's temp directory (_temp, emptied by
# the runner). File names only, never their content.
found=$(grep -rlI --exclude-dir=_temp -e AGE-SECRET-KEY- /home /root /opt /etc /tmp /var/tmp 2>/dev/null | head -5 | paste -sd' ' -)
[ -z "$found" ] && ok "no age key outside a job's temp directory" || fail "age key in: $found"
[ -f "$dir/.runner" ] && ok "the runner is registered" || fail "the runner isn't registered"
svc=$(cat "$dir/.service" 2>/dev/null)
[ -n "$svc" ] && systemctl is-active -q "$svc" && ok "its service is running ($svc)" || fail "its service isn't running"
listener=$(ps -o user= -C Runner.Listener 2>/dev/null | sort -u | paste -sd' ' -)
[ "$listener" = "$u" ] && ok "the runner runs as $u" || fail "the runner runs as: ${listener:-nothing}"
grep -qx 'HOMELAB_DRY_RUN=1' "$dir/.env" 2>/dev/null && ok "jobs get HOMELAB_DRY_RUN=1" || fail "HOMELAB_DRY_RUN=1 isn't in $dir/.env"
hook=$(sed -n 's/^ACTIONS_RUNNER_HOOK_JOB_COMPLETED=//p' "$dir/.env" 2>/dev/null)
[ -n "$hook" ] && [ "$(stat -c %U "$hook" 2>/dev/null)" = root ] && ! sudo -u "$u" test -w "$hook" &&
  ok "the job-completed hook is root's, not writable by $u" || fail "the job-completed hook is missing or writable by $u"
exit $rc
EOF
rc=$?

# From your machine, with the ci key: a harmless write (create a pool) as
# ci@pve!plan must be refused. proxmox_endpoint's default.
f="{{config_root}}/ci/dry-run.sops.yaml"
if [ ! -e "$f" ]; then echo "ok    ci/dry-run.sops.yaml not present yet"
else
  # The key path first: in `HOME=... VAR="$HOME/..."`, $HOME is already the temp dir.
  ci="$HOME/.config/sops/age/ci.txt"
  code=$(HOME=$(mktemp -d) SOPS_AGE_KEY_FILE="$ci" sops exec-env "$f" 'printf "Authorization: PVEAPIToken=%s\n" "$TF_VAR_proxmox_api_token" | curl -sk -o /dev/null -w "%{http_code}" -H @- -X POST -d poolid=runner-check https://192.168.68.20:8006/api2/json/pools' 2>/dev/null)
  case "$code" in
    403) echo "ok    ci@pve!plan can't write (HTTP 403)" ;;
    200) echo "FAIL  ci@pve!plan CAN write (HTTP 200): delete pool runner-check, fix its ACL"; rc=1 ;;
    *)   echo "FAIL  ci@pve!plan write check inconclusive (HTTP $code)"; rc=1 ;;
  esac
fi

# The dry-run environment is the boundary: without a required reviewer, a
# pull request's code runs on runner01 with the ci key, unattended.
# With your gh login (the AI agent's token can't read environments).
envjson=$(gh api repos/BCochofelHomelab/homelab-proxmox-core/environments/dry-run 2>/dev/null)
reviewers=$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?.reviewer | (.slug // .login)] | join(",")' <<<"$envjson" 2>/dev/null)
bypass=$(jq -r '.can_admins_bypass' <<<"$envjson" 2>/dev/null)
[ -n "$reviewers" ] && ok_env=1 || ok_env=0
if [ "$ok_env" = 1 ]; then echo "ok    dry-run environment requires a reviewer ($reviewers)"
else echo "FAIL  dry-run environment has no required reviewer: jobs run on runner01 unapproved"; rc=1; fi
if [ "$bypass" = false ]; then echo "ok    dry-run environment: administrators can't bypass it"
else echo "FAIL  dry-run environment: administrators can bypass it (or it couldn't be read)"; rc=1; fi
exit $rc
'''

[tasks."mcp:install"]
description = "Install the Proxmox MCP server at its pinned commit into ~/.local/share/mcp-proxmox"
shell = "bash -c"
run = '''
set -euo pipefail
# Not published to npm: pin a commit you've reviewed. To bump it, review
# the diff (git -C ~/.local/share/mcp-proxmox log -p <old>..<new>) first.
rev=6186c715b5ff393adc9fdf597a791c35bc2f90c7
dir="$HOME/.local/share/mcp-proxmox"
[ -d "$dir/.git" ] || git clone -q https://github.com/gilby125/mcp-proxmox "$dir"
git -C "$dir" fetch -q origin
git -C "$dir" checkout -q "$rev"
# No package-lock.json upstream, so `npm install`, not `npm ci`.
cd "$dir" && npm install --omit=dev --ignore-scripts --no-audit --no-fund --silent
echo "Proxmox MCP server at $rev in $dir"
# Where the MCP servers write their logs (.mcp.json: terraform-mcp-server --log-file).
mkdir -p "$HOME/.local/state/mcp"
'''
