[defaults]
remote_user = ubuntu
private_key_file = ~/.ssh/id_ed25519
host_key_checking = False

# Files, not the inventory/ directory: a directory scan skips .ini files
# (INVENTORY_IGNORE_EXTS), so they would silently not load. hosts.ini is
# the VMs (generated by OpenTofu), proxmox.ini the Proxmox host
# (hand-authored); both share inventory/group_vars/.
inventory = inventory/hosts.ini,inventory/proxmox.ini
roles_path = roles

# Facts only as ansible_facts['...'], ansible-core's future default
# (top-level ansible_* facts are deprecated, removed in 2.24).
inject_facts_as_vars = False

callback_whitelist = profile_tasks

# host_group_vars must stay listed: this setting replaces Ansible's default
# list rather than adding to it, so dropping it would silently stop every
# plain group_vars/host_vars file from loading.
vars_plugins_enabled = host_group_vars,community.sops.sops

# fact caching (24-hour timeout, JSON file)
gathering = smart
fact_caching_timeout = 86400
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/tmp/ansible_fact_cache

[community.sops]
# Decrypt group_vars/*.sops.yaml only while a task runs, never when the
# inventory is loaded — so ansible-lint, --syntax-check and
# ansible-inventory never decrypt anything.
vars_stage = task

[ssh_connection]
pipelining = True
