---
# Full provision. Run after `tofu apply` has generated inventory/hosts.ini.

# On the CI dry-run runner every job has HOMELAB_DRY_RUN=1 (docs/SETUP.md):
# there, refuse anything but --check. A backstop only, since a pull request
# can remove it; the dry-run environment's approval is the boundary.
- name: Dry-run guard
  hosts: all
  gather_facts: false
  tasks:
    - name: Refuse a real run where HOMELAB_DRY_RUN=1
      ansible.builtin.assert:
        that: ansible_check_mode or lookup('ansible.builtin.env', 'HOMELAB_DRY_RUN') != '1'
        fail_msg: HOMELAB_DRY_RUN=1 (the CI dry-run runner) allows only --check.
        quiet: true
      run_once: true

- name: Bootstrap
  import_playbook: 00-bootstrap.yml
- name: CI dry-run runner's SSH key
  import_playbook: 01-ci-ssh-key.yml
- name: DNS
  import_playbook: 05-dns.yml
- name: Caddy
  import_playbook: 10-caddy.yml
- name: Elastic Agent
  import_playbook: 20-elastic-agent.yml
- name: Health check
  import_playbook: 99-healthcheck.yml
