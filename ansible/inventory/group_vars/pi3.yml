---
# ============================================================================
# Hand-authored tuning for the pi3 group (pi3-01 — a Raspberry Pi 3 running
# Pi-hole's secondary instance). NOT generated by Terraform; this host isn't
# managed by Terraform at all — see inventory/hosts_static.ini.
#
# Settings shared with server01's primary Pihole instance (version,
# timezone, web password, revServers subnet) live in group_vars/pihole.yml
# instead, so both stay identical automatically.
# ============================================================================

# roles/common's asserts.yml assumes Docker was pre-baked by Packer, which
# doesn't apply here — pi3-01 was set up by hand, not via this repo's Packer
# template. false triggers roles/common/tasks/install_docker.yml first.
docker_preinstalled: false

# pi3-01 is single-purpose (only Pihole runs on it) — no CoreDNS sharing the
# host, so there's no port-53 contention to design around like server01 has.
# Host networking uses the Pi's own IP directly: simpler compose file, no
# macvlan setup, and avoids the documented Docker macvlan
# can't-reach-itself quirk entirely. roles/pihole templates branch on this.
pihole_network_mode: host
pihole_ip: 192.168.68.6

pihole_base_dir: /opt/pihole
