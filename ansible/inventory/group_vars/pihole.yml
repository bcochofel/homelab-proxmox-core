---
# ============================================================================
# Hand-authored tuning for the pihole group (a pure grouping group spanning
# dns + pi3 — see inventory/hosts_static.ini). NOT generated by Terraform.
#
# Vars here are shared by BOTH Pihole instances (server01's primary and
# pi3-01's secondary), so they're guaranteed identical — the config-parity
# half of the primary/secondary redundancy plan (TODO.md Phase 2). Instance-
# specific vars (network mode, project dir, own IP) live in group_vars/dns.yml
# and group_vars/pi3.yml instead.
# ============================================================================

# Pihole image tag — pin exact, check https://hub.docker.com/r/pihole/pihole/tags
# Checked 2026-08-15: already the latest non-nightly tag, no bump needed.
pihole_version: "2026.07.2"

pihole_timezone: Europe/Lisbon

# Subnet Pihole's FTLCONF_dns_revServers conditional-forward ACL entries
# apply to (roles/pihole/templates/env.j2) — same CIDR as dns_macvlan_subnet
# in group_vars/dns.yml, but named for what it actually means here: pi3-01
# has no macvlan network at all (host networking, see group_vars/pi3.yml),
# so this var lets both instances share the value without pi3-01 needing to
# know anything about macvlan.
pihole_revserver_subnet: 192.168.68.0/22

# ---- Secrets ----
# Sourced from secrets.yaml via direnv on the control machine (see
# ansible/.envrc), not per-target-host — already identical for any host this
# resolves against. See the preflight assert in roles/common/tasks/asserts.yml.
pihole_webpassword: "{{ lookup('env', 'PIHOLE_WEBPASSWORD') }}"
