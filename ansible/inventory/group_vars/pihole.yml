---
# ============================================================================
# Hand-authored tuning for the pihole group (every Pihole this repo deploys:
# today the dns group, see terraform/templates/inventory.ini.tftpl). NOT
# generated by Terraform.
#
# These are the settings the secondary Pihole on the QNAP (Container
# Station, set up by hand) must mirror — keep docs/PIHOLE-SECONDARY.md in
# step whenever one changes. Instance-specific vars (project dir, own IP)
# live in group_vars/dns.yml instead.
# ============================================================================

# Pihole image tag — pin exact, check https://hub.docker.com/r/pihole/pihole/tags
# Use a real non-nightly tag from Docker Hub — don't guess version numbers.
pihole_version: "2026.07.2"

pihole_timezone: Europe/Lisbon

# Subnet Pihole's FTLCONF_dns_revServers conditional-forward entries apply
# to (roles/pihole/templates/env.j2) — same CIDR as dns_macvlan_subnet in
# group_vars/dns.yml, but named for what it means here, since the QNAP
# secondary has no macvlan network.
pihole_revserver_subnet: 192.168.68.0/22

# pihole_webpassword lives in pihole.sops.yaml next to this file
# (SOPS-encrypted, decrypted at task time by the community.sops vars plugin
# — see ansible.cfg and docs/CREDENTIALS.md).
