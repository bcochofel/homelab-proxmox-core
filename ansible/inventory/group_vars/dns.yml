---
# ============================================================================
# Hand-authored tuning for the dns group. NOT generated by Terraform.
# ============================================================================

# Where the coredns/pihole Docker Compose projects live on the host.
dns_base_dir: /opt/dns

# Docker macvlan network both containers attach to, so each gets its own
# real LAN IP and can independently answer on port 53 (true ns1/ns2
# redundancy — see CLAUDE.md). Parent is the VM's own NIC.
dns_macvlan_network: dns_macvlan
dns_macvlan_parent: eth0
dns_macvlan_subnet: 192.168.68.0/22
dns_macvlan_gateway: 192.168.68.1

# CoreDNS image tag — pin exact, check https://hub.docker.com/r/coredns/coredns/tags
coredns_version: "1.13.1"
coredns_ip: 192.168.68.42

# Pihole image tag — pin exact, check https://hub.docker.com/r/pihole/pihole/tags
pihole_version: "2026.07.2"
pihole_ip: 192.168.68.43
pihole_timezone: Europe/Lisbon

# ---- Single source of truth for the local zone ----
# Both coredns's hosts.local and pihole's FTLCONF_dns_hosts (env.j2 — Pi-hole
# v6/FTL v6 never reads /etc/pihole/custom.list; dns.hosts must be forced
# via env var) render from this same list (fresh start, no import of the
# old QNAP-hosted Pihole/CoreDNS config). Every Caddy-managed fqdn
# (kibana/nas/www/pve1) resolves to Caddy's IP, not its backend — keep this
# in sync with caddy_sites in group_vars/all.yml.
dns_hosts:
  - { ip: 192.168.68.1, fqdn: gw.homelab.bcochofel.com }
  - { ip: 192.168.68.15, fqdn: haos.homelab.bcochofel.com }
  - { ip: 192.168.68.40, fqdn: proxy.homelab.bcochofel.com }
  - { ip: 192.168.68.40, fqdn: kibana.homelab.bcochofel.com } # via Caddy, not the raw kibana IP
  - { ip: 192.168.68.40, fqdn: nas.homelab.bcochofel.com } # via Caddy, not the raw NAS IP
  - { ip: 192.168.68.40, fqdn: www.homelab.bcochofel.com } # via Caddy
  - { ip: 192.168.68.40, fqdn: pve1.homelab.bcochofel.com } # via Caddy, not the raw Proxmox UI IP
  - { ip: 192.168.68.41, fqdn: dns.homelab.bcochofel.com }
  - { ip: 192.168.68.42, fqdn: ns1.homelab.bcochofel.com } # CoreDNS
  - { ip: 192.168.68.43, fqdn: ns2.homelab.bcochofel.com } # Pihole
  - { ip: 192.168.68.25, fqdn: otel-demo.homelab.bcochofel.com } # k3s cluster, via in-cluster Traefik ingress
  - { ip: 192.168.68.25, fqdn: argocd.homelab.bcochofel.com } # k3s cluster, via in-cluster Traefik ingress

# External resolvers for anything not in dns_hosts — both CoreDNS's forward
# plugin and Pihole's upstream DNS use this same list, so either service
# alone is a fully working resolver (not chained through the other).
dns_forward_resolvers: ["1.1.1.1", "8.8.8.8"]

# ---- Secrets ----
pihole_webpassword: "{{ lookup('env', 'PIHOLE_WEBPASSWORD') }}"
