---
# ============================================================================
# Hand-authored tuning for the dns group (server01 — the Proxmox VM running
# CoreDNS + the primary Pihole instance). NOT generated by Terraform.
#
# Vars that must be identical across BOTH Pihole instances (server01's and
# pi3-01's) live in group_vars/pihole.yml instead — see that file's header.
# Zone-wide constants CoreDNS and Pihole both need live in group_vars/all.yml.
# ============================================================================

# Where the coredns/pihole Docker Compose projects live on the host.
dns_base_dir: /opt/dns

# Docker macvlan network CoreDNS (primary) and Pihole attach to, so each
# gets its own real LAN IP and can independently answer on port 53 — see
# CLAUDE.md. Parent is the VM's own NIC. The QNAP-hosted CoreDNS secondary
# (coredns_secondary_ip) is NOT on this network — it's a separate physical
# device, unmanaged by this repo, that pulls the zone via AXFR. It still
# gets its own dedicated LAN IP like the other two, just via QNAP
# Container Station's own network mechanism (e.g. the `qnet` driver, or
# Container Station's native LAN-IP assignment) rather than Docker's
# generic `macvlan` driver — QNAP's port 53 is only bound to localhost on
# its own host IP, so a dedicated address avoids that entirely rather
# than needing to share/publish onto it.
dns_macvlan_network: dns_macvlan
dns_macvlan_parent: eth0
dns_macvlan_subnet: 192.168.68.0/22
dns_macvlan_gateway: 192.168.68.1

# CoreDNS image tag — pin exact, check https://hub.docker.com/r/coredns/coredns/tags
# Bumped to latest (1.14.6, released 2026-07-10) on 2026-08-15 — changelog
# since 1.13.1 is additive (file/transfer/acl/forward plugin improvements
# only), no breaking changes for this repo's Corefile.
coredns_version: "1.14.6"

# ---- server01's Pihole instance (primary — see group_vars/pihole.yml for
# the settings shared with pi3-01's secondary instance) ----
# On this host Pihole shares the dns_macvlan_network with CoreDNS (both need
# independent port 53), so it gets its own dedicated LAN IP via macvlan
# rather than the VM's own management IP. pi3-01 is single-purpose (no
# CoreDNS to share port 53 with) so it uses host networking instead — see
# group_vars/pi3.yml. roles/pihole templates branch on pihole_network_mode.
pihole_network_mode: macvlan
pihole_ip: 192.168.68.5
pihole_base_dir: "{{ dns_base_dir }}/pihole"

# ---- Single source of truth for the local zone ----
# Only coredns's zone file (templates/db.zone.j2) renders from this list
# now. Pihole no longer renders FTLCONF_dns_hosts — it's ad-blocking only
# and conditionally forwards dns_zone queries to CoreDNS instead (see
# roles/pihole/templates/env.j2's FTLCONF_dns_revServers). Every
# Caddy-managed fqdn (kibana/nas/www/pve1) resolves to Caddy's IP, not its
# backend — keep this in sync with caddy_sites in group_vars/all.yml.
dns_hosts:
  - { ip: 192.168.68.1, fqdn: gw.homelab.bcochofel.com }
  - { ip: 192.168.68.16, fqdn: proxy.homelab.bcochofel.com }
  - { ip: 192.168.68.16, fqdn: kibana.homelab.bcochofel.com } # via Caddy, not the raw kibana IP
  - { ip: 192.168.68.16, fqdn: nas.homelab.bcochofel.com } # via Caddy, not the raw NAS IP
  - { ip: 192.168.68.16, fqdn: www.homelab.bcochofel.com } # via Caddy
  - { ip: 192.168.68.16, fqdn: pve1.homelab.bcochofel.com } # via Caddy, not the raw Proxmox UI IP
  - { ip: 192.168.68.15, fqdn: server01.homelab.bcochofel.com } # dns VM's own mgmt IP (Proxmox name: server01)
  - { ip: 192.168.68.2, fqdn: ns1.homelab.bcochofel.com } # CoreDNS primary (authoritative)
  - { ip: 192.168.68.3, fqdn: ns2.homelab.bcochofel.com } # CoreDNS secondary (QNAP, AXFR from ns1)
  - { ip: 192.168.68.5, fqdn: pihole.homelab.bcochofel.com } # Pihole primary (ad-blocking + conditional forward)
  - { ip: 192.168.68.6, fqdn: pi3-01.homelab.bcochofel.com } # Pihole secondary's own host (config parity, see group_vars/pihole.yml)
  - { ip: 192.168.68.40, fqdn: otel-demo.homelab.bcochofel.com } # via K3s Traefik
  - { ip: 192.168.68.40, fqdn: argocd.homelab.bcochofel.com } # via K3s Traefik
  - { ip: 192.168.68.40, fqdn: hubble.homelab.bcochofel.com } # via K3s Traefik
