---
# ============================================================================
# Hand-authored tuning. NOT generated by Terraform.
# ============================================================================

# Where the Caddy Docker Compose project lives on the host.
caddy_base_dir: /opt/caddy

# Caddy image tag — pin exact, check https://hub.docker.com/_/caddy for the
# current stable release before bumping, and read the changelog for
# anything affecting the xcaddy + caddy-dns/cloudflare + per-site
# issuer acme{} setup here.
caddy_version: "2.11.4"

# ---- Sites Caddy reverse-proxies ----
# Each fqdn needs its DNS record pointed at this VM's IP before Caddy can
# issue a cert for it or receive real traffic — rendered into CoreDNS's
# zone file (db.zone.j2) from inventory/group_vars/dns.yml's dns_hosts
# list. Keep the two lists in sync: every fqdn below should have a
# matching dns_hosts entry pointed at 192.168.68.16 (this VM), not at the
# raw upstream IP.
#
# Every backend here is an external dependency: 99-healthcheck.yml reports
# one that isn't ready without stopping the playbook. Set
# `upstream_sni: <fqdn>` when the backend is addressed by IP but presents a
# cert issued for its own hostname (TLS bridging).
caddy_sites:
  - fqdn: nas.homelab.bcochofel.com
    upstream: "https://192.168.68.10:443"
    insecure_skip_verify: true # QNAP QTS admin UI's self-signed cert
  - fqdn: www.homelab.bcochofel.com
    upstream: "http://192.168.68.10:80"
  - fqdn: pve1.homelab.bcochofel.com
    upstream: "https://192.168.68.20:8006"
    # Proxmox's default self-signed cert — drop this if a real cert is
    # ever set on Proxmox itself. Proxmox's noVNC/xterm.js console uses
    # WebSockets over this same port; Caddy's reverse_proxy handles the
    # HTTP Upgrade transparently, no extra config needed.
    insecure_skip_verify: true
  - fqdn: ha.homelab.bcochofel.com
    # Home Assistant on the Raspberry Pi 3 (not managed by this repo). It
    # answers 400 until it trusts Caddy as a proxy — see
    # docs/EXTERNAL-DEPENDENCIES.md#home-assistant.
    upstream: "http://192.168.68.11:8123"

# ACME account contact — not a secret, so it's a plain value here rather
# than routed through ~/.secrets/ or a .sops.yaml file.
letsencrypt_email: bruno.cochofel@gmail.com

# DNS resolvers Caddy's ACME DNS-01 challenge uses to look up the zone and
# check TXT-record propagation — deliberately public resolvers, NOT this
# VM's own system resolver (CoreDNS/Pihole). CoreDNS is authoritative for
# homelab.bcochofel.com (see roles/coredns), so if Caddy used the system
# resolver here, its zone-cut discovery would get a real SOA answer for
# homelab.bcochofel.com and stop there — never walking up to the actual
# Cloudflare-hosted zone (bcochofel.com) — and fail with "expected 1 zone,
# got 0 for homelab.bcochofel.com" (see roles/caddy/templates/
# Caddyfile.j2's per-site `tls { issuer acme { ... resolvers ... } }`).
letsencrypt_dns_resolvers: ["1.1.1.1", "8.8.8.8"]

# ---- DNS zone-wide constants ----
# Shared by CoreDNS (dns group) and Pihole (pihole group), and copied by hand
# into the QNAP-hosted secondaries (docs/EXTERNAL-DEPENDENCIES.md).

# Zone this repo is authoritative for. Feeds CoreDNS's Corefile/zone file
# (server-block name, $ORIGIN, SOA) and both Pihole instances'
# FTLCONF_dns_revServers domain field — one place instead of hardcoding the
# name repeatedly.
dns_zone: homelab.bcochofel.com

# Primary — authoritative for dns_zone, source of AXFR to coredns_secondary_ip.
coredns_ip: 192.168.68.2
# QNAP-hosted secondary (Container Station, NOT Ansible-managed) — its own
# dedicated LAN IP, via QNAP's own network mechanism rather than Docker's
# macvlan driver (see dns_macvlan_network in group_vars/dns.yml). Used here
# only as a value: CoreDNS primary's `transfer to`, this zone's NS record,
# both Pihole instances' FTLCONF_dns_revServers, and the ns2 dns_hosts entry.
coredns_secondary_ip: 192.168.68.3
# QNAP-hosted Pihole secondary (Container Station, NOT Ansible-managed,
# docs/EXTERNAL-DEPENDENCIES.md). Used only by 99-healthcheck.yml's external
# checks.
pihole_secondary_ip: 192.168.68.6

# External resolvers for anything outside dns_zone. Used by CoreDNS's
# catch-all `.` server block's forward plugin and by both Pihole instances'
# default upstream. Local-zone queries don't use this list on the Pihole
# side — see FTLCONF_dns_revServers in roles/pihole/templates/env.j2.
dns_forward_resolvers: ["1.1.1.1", "8.8.8.8"]

# cloudflare_api_token (Caddy's DNS-01 ACME) lives in caddy.sops.yaml next to
# this file — only the caddy group needs it (docs/CREDENTIALS.md).
