# Hand-authored, committed (unlike hosts.ini, which OpenTofu generates).
# The Proxmox VE nodes themselves: Debian hosts, not VMs from the template.
# One line per node; each gets the `ansible` user first (docs/CREDENTIALS.md,
# "SSH user for Ansible on the Proxmox nodes"), and its own Elastic Agent in
# the same Fleet policy (group_vars/proxmox.yml).
[proxmox]
pve1 ansible_host=192.168.68.20
# pve2 ansible_host=192.168.68.21

# The `ansible` user, with passwordless sudo, on every node; the system
# Python 3, named rather than discovered (a later python3.x would change it).
[proxmox:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3
