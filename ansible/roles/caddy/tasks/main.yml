---
# tasks file for caddy — build+render Dockerfile/Caddyfile/compose/env,
# bring up the reverse proxy

- name: Create Caddy project directory
  ansible.builtin.file:
    path: "{{ caddy_base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Render Dockerfile (Caddy + caddy-dns/cloudflare, built via xcaddy)
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ caddy_base_dir }}/Dockerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true

- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_base_dir }}/Caddyfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true
  register: _caddyfile

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true

- name: Render .env (Cloudflare token + ACME email — never templated into the Caddyfile itself)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ caddy_base_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  become: true
  register: _caddy_env
  no_log: true

# Raw `docker compose` instead of community.docker.docker_compose_v2: that
# module diffs `docker compose images` state before/after to report changed,
# and repeatedly failed with "No such image: sha256:..." once the previous
# build's (now-untagged) image got garbage-collected out from under it —
# a stale-reference race in the module's own idempotency check, not
# anything wrong with the compose project itself. Building unconditionally
# on every run also matches this repo's stated intent (Caddy's image is
# built at deploy time via xcaddy, see CLAUDE.md), so there's no need for
# the previous notify/handler dance to only rebuild on template changes —
# BuildKit's layer cache already makes a no-op rebuild fast.
- name: Build and bring up Caddy
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ caddy_base_dir }}"
  become: true
  register: _caddy_up
  changed_when: >-
    'Container caddy  Started' in _caddy_up.stderr or
    'Container caddy  Recreated' in _caddy_up.stderr or
    'Container caddy  Created' in _caddy_up.stderr

# `docker compose up` above only recreates a container when the *service
# definition* changes (image, environment, volume list) — it never diffs
# the *contents* of a bind-mounted file. Caddyfile and .env are both
# bind-mounted (not baked into the image), so a content-only change to
# either is silently invisible to `up` forever: no error, no restart, the
# running Caddy process just keeps its old in-memory config indefinitely.
# Hit for real 2026-08-15 — a Caddyfile fix was rendered to disk correctly
# but Caddy never picked it up until a manual `docker restart caddy`.
# Skipped when `up` already recreated the container (it already has the
# latest files in that case) to avoid a redundant extra restart.
- name: Restart Caddy if Caddyfile or .env changed (bind-mounted, up -d won't detect this)
  ansible.builtin.command:
    cmd: docker compose restart caddy
    chdir: "{{ caddy_base_dir }}"
  become: true
  when: (_caddyfile.changed or _caddy_env.changed) and not _caddy_up.changed
