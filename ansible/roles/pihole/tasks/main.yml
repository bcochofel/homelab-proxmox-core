---
# tasks file for pihole — render env + compose, bring up the container.
# Applies to the pihole group (today just the dns group) — pihole_base_dir
# and pihole_ip come from group_vars/dns.yml; everything in
# group_vars/pihole.yml is shared with the hand-managed QNAP secondary
# (docs/EXTERNAL-DEPENDENCIES.md#pi-hole-secondary). Local DNS records (dns_hosts) are
# CoreDNS's job only — see env.j2's comment for why Pihole doesn't
# render them.

- name: Create Pihole project directory
  ansible.builtin.file:
    path: "{{ pihole_base_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ pihole_base_dir }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  become: true
  notify: Restart pihole

- name: Render .env (WEBPASSWORD, upstream resolvers — never templated into the compose file itself)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ pihole_base_dir }}/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0640"
  become: true
  no_log: true
  notify: Restart pihole

- name: Bring up Pihole
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_base_dir }}"
    state: present
  become: true
