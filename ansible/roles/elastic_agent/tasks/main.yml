---
# Enrolls the Elastic Agent the Packer template installed (tarball,
# Fleet-upgradable, not enrolled, service disabled; packer/ubuntu-26.04
# ADR-3) into homelab-proxmox-workloads' Fleet, with the enrollment token of
# its policy, once: an enrolled agent is never re-enrolled, only waited
# for until it's connected. Hosts not built from the template
# (elastic_agent_install) get it installed the same way first (install.yml).

- name: Check the enrollment token is available
  ansible.builtin.assert:
    that:
      - fleet_enrollment_tokens is defined
      - fleet_enrollment_tokens[elastic_agent_policy] is defined
      - fleet_enrollment_tokens[elastic_agent_policy] | length > 0
    fail_msg: >-
      fleet_enrollment_tokens['{{ elastic_agent_policy }}'] is missing from
      inventory/group_vars/all.sops.yaml (docs/ANSIBLE.md).
    quiet: true
  no_log: true

- name: Check whether the agent is installed
  ansible.builtin.stat:
    path: /usr/bin/elastic-agent
  register: _agent_binary

- name: Install the agent from Elastic's tarball
  ansible.builtin.include_tasks: install.yml
  when: elastic_agent_install and not _agent_binary.stat.exists

- name: Create the directory for the agent's CA
  ansible.builtin.file:
    path: "{{ elastic_agent_ca | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Fleet Server's certificate is issued by homelab-proxmox-workloads' CA.
- name: Install that CA for the agent
  ansible.builtin.copy:
    src: "{{ elastic_agent_ca_src }}"
    dest: "{{ elastic_agent_ca }}"
    owner: root
    group: root
    mode: "0644"
  become: true

# Running first: `status` and `enroll` talk to the daemon, and it's the
# end state anyway. The template's agent starts standalone, shipping nothing.
- name: Keep the agent running and enabled at boot
  ansible.builtin.systemd_service:
    name: elastic-agent
    state: started
    enabled: true
  become: true

# `status` exits non-zero whenever any component is unhealthy (a degraded
# integration, say), even though the agent answers and may be connected:
# the JSON is what's judged, never the exit code. Waits for the daemon to
# answer at all.
- name: Read the agent's status
  ansible.builtin.command: /usr/bin/elastic-agent status --output json
  become: true
  register: _agent_status
  changed_when: false
  failed_when: false
  until: _agent_status.stdout is search('"FleetState"')
  retries: 12
  delay: 5

# Only an agent that isn't enrolled gets enrolled. An enrolled one that
# isn't connected right now (Fleet Server unreachable, or a slow check-in)
# is waited for below, never re-enrolled: `enroll --force` registers a new
# agent and leaves the old one offline in Fleet.
- name: Decide whether to enroll
  ansible.builtin.set_fact:
    _agent_enroll: "{{ not ((_agent_status.stdout | from_json).info.is_managed | default(false)) }}"

- name: Enroll into {{ elastic_agent_policy }}
  when: _agent_enroll
  block:
    # The token is on the command line for the few seconds `enroll` runs:
    # it has no file option.
    - name: Enroll the agent
      ansible.builtin.command:
        argv:
          - /usr/bin/elastic-agent
          - enroll
          - --force
          - --url={{ elastic_agent_fleet_url }}
          - --certificate-authorities={{ elastic_agent_ca }}
          - --enrollment-token={{ fleet_enrollment_tokens[elastic_agent_policy] }}
      become: true
      changed_when: true
      no_log: true

- name: Wait for the agent to be connected to Fleet
  ansible.builtin.command: /usr/bin/elastic-agent status --output json
  become: true
  register: _agent_status_after
  changed_when: false
  failed_when: false
  until: >-
    _agent_status_after.stdout is search('"FleetState"')
    and ((_agent_status_after.stdout | from_json).info.is_managed | default(false))
    and ((_agent_status_after.stdout | from_json).FleetState | default(0)) == 2
  retries: 30
  delay: 10
