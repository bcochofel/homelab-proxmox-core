---
# Enrolls the Elastic Agent the Packer template installed (tarball,
# Fleet-upgradable, not enrolled, service disabled; packer/ubuntu-26.04
# ADR-3) into homelab-proxmox-workloads' Fleet, with the enrollment token of
# its policy. An agent that's enrolled and connected is left alone.

- name: Check the enrollment token is available
  ansible.builtin.assert:
    that:
      - fleet_enrollment_tokens is defined
      - fleet_enrollment_tokens[elastic_agent_policy] is defined
      - fleet_enrollment_tokens[elastic_agent_policy] | length > 0
    fail_msg: >-
      fleet_enrollment_tokens['{{ elastic_agent_policy }}'] is missing from
      inventory/group_vars/all.sops.yaml (docs/ANSIBLE.md).
    quiet: true
  no_log: true

- name: Create the directory for the agent's CA
  ansible.builtin.file:
    path: "{{ elastic_agent_ca | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

# Fleet Server's certificate is issued by homelab-proxmox-workloads' CA.
- name: Install that CA for the agent
  ansible.builtin.copy:
    src: "{{ elastic_agent_ca_src }}"
    dest: "{{ elastic_agent_ca }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Read the agent's status
  ansible.builtin.command: /usr/bin/elastic-agent status --output json
  become: true
  register: _agent_status
  changed_when: false
  failed_when: false

# Managed by Fleet and connected; anything else (daemon not running, not
# enrolled, can't reach Fleet Server) gets enrolled.
- name: Decide whether to enroll
  ansible.builtin.set_fact:
    _agent_enroll: >-
      {{ _agent_status.rc != 0
         or not ((_agent_status.stdout | from_json).info.is_managed | default(false))
         or ((_agent_status.stdout | from_json).FleetState | default(0)) != 2 }}

- name: Enroll into {{ elastic_agent_policy }}
  when: _agent_enroll
  block:
    # enroll talks to the running agent daemon.
    - name: Start the agent
      ansible.builtin.systemd_service:
        name: elastic-agent
        state: started
        enabled: true
      become: true

    # The token is on the command line for the few seconds `enroll` runs:
    # it has no file option.
    - name: Enroll the agent
      ansible.builtin.command:
        argv:
          - /usr/bin/elastic-agent
          - enroll
          - --force
          - --url={{ elastic_agent_fleet_url }}
          - --certificate-authorities={{ elastic_agent_ca }}
          - --enrollment-token={{ fleet_enrollment_tokens[elastic_agent_policy] }}
      become: true
      changed_when: true
      no_log: true

- name: Keep the agent running and enabled at boot
  ansible.builtin.systemd_service:
    name: elastic-agent
    state: started
    enabled: true
  become: true

- name: Wait for the agent to be connected to Fleet
  ansible.builtin.command: /usr/bin/elastic-agent status --output json
  become: true
  register: _agent_status_after
  changed_when: false
  failed_when: false
  until: >-
    _agent_status_after.rc == 0
    and ((_agent_status_after.stdout | from_json).info.is_managed | default(false))
    and ((_agent_status_after.stdout | from_json).FleetState | default(0)) == 2
  retries: 30
  delay: 10
