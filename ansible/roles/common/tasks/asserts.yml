---
# File: asserts.yml - preflight checks

- name: Debug OS
  ansible.builtin.debug:
    msg: "{{ ansible_os_family }} > {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: Check distribution compatibility
  ansible.builtin.fail:
    msg: "{{ ansible_distribution }} is not supported by this role"
  when: ansible_distribution != 'Ubuntu'

- name: Fail if not a supported release of Ubuntu
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version for this role"
  when: ansible_distribution_version is version_compare(22.04, '<')

- name: Verify Docker is installed (baked by Packer template)
  ansible.builtin.command: docker --version
  register: _docker_check
  changed_when: false
  failed_when: _docker_check.rc != 0

- name: Verify Docker Compose plugin is installed
  ansible.builtin.command: docker compose version
  register: _compose_check
  changed_when: false
  failed_when: _compose_check.rc != 0

- name: Verify Cloudflare API token is available (Caddy ACME preflight)
  ansible.builtin.assert:
    that:
      - cloudflare_api_token is defined
      - cloudflare_api_token | length > 0
    fail_msg: >-
      cloudflare_api_token is missing. Create
      inventory/group_vars/caddy.sops.yaml with `sops` — see
      docs/CREDENTIALS.md.
  when: "'caddy' in group_names"

- name: Verify Pihole web password is available (Pihole preflight)
  ansible.builtin.assert:
    that:
      - pihole_webpassword is defined
      - pihole_webpassword | length > 0
    fail_msg: >-
      pihole_webpassword is missing. Create
      inventory/group_vars/pihole.sops.yaml with `sops` — see
      docs/CREDENTIALS.md.
  when: "'pihole' in group_names"
