---
# tasks file for common's Docker installation — only run when
# docker_preinstalled is false (group_vars/pi3.yml), for hosts not
# provisioned by this repo's Packer template. Apt-based install per Docker's
# official Debian instructions (https://docs.docker.com/engine/install/debian/)
# — works for Raspberry Pi OS since it's Debian-based. No new Galaxy role
# dependency, matching this repo's existing minimal-collections style
# (requirements.yml only pins community.docker + ansible.utils).

- name: Install apt prerequisites for Docker's repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  become: true

- name: Determine dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: _dpkg_arch
  changed_when: false

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ _dpkg_arch.stdout }}"
    signed_by: https://download.docker.com/linux/debian/gpg
    install_python_debian: true
  become: true

- name: Install Docker Engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true

- name: Add ansible_user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  become: true
