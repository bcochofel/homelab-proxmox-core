# defaults file for coredns
#
# dns_base_dir, coredns_version, dns_hosts, and the dns_macvlan_* vars are
# cross-role-visible — defined in inventory/group_vars/dns.yml instead, not
# here. coredns_ip, coredns_secondary_ip, dns_zone, and dns_forward_resolvers
# are zone-wide constants Pihole also needs, so they live in
# inventory/group_vars/all.yml instead (same reasoning as caddy_base_dir
# there).
