---
# Dry-runs a pull request against the live homelab (docs/RUNNER.md): `tofu
# plan` when it changes terraform/, `ansible-playbook --check --diff` when it
# changes ansible/, on the self-hosted runner runner01, as the plan-scoped
# `ci` identity.
#
# The boundary is the `dry-run` environment: the jobs that use the runner
# wait for its required reviewer (sre-lead), and only they can read its one
# secret, CI_AGE_KEY. A pull request can edit this file, so nothing in it is
# the boundary. Never `pull_request_target`; a fork's pull request never
# reaches the runner. Only the plan summary and the Ansible recap reach the
# (public) log; the full output is an artifact encrypted to the human and
# ai-agent age keys.
name: Dry-run

on:
  pull_request:

permissions: {}

# One dry-run at a time across the repository: plans and checks never
# overlap on the state lock or the hosts.
concurrency:
  group: dry-run
  cancel-in-progress: false

env:
  # Install exactly what mise.lock records, and skip mise.toml's bootstrap
  # (git hooks, TFLint plugins...): each job installs only what it runs.
  MISE_LOCKED: "1"
  MISE_SKIP_BOOTSTRAP: "1"
  # Who can read the full output (`age -r`): the human, and the AI agent,
  # which downloads the artifact with its read-only token.
  OUTPUT_RECIPIENT_HUMAN: age1fucsvstpr082zemctfpjn2xkwq86thvlzan4tp9fyvg2q0rnnemshw690m
  OUTPUT_RECIPIENT_AI_AGENT: age1hy2pqyv75m0y7uyvqp73mmazdy6ldwc950d5jzlsntthpl3l4uxqg0u076

jobs:
  changes:
    name: What changed
    # Same-repository pull requests only: a fork's never reaches the runner.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # gh pr view: the pull request's file list
    outputs:
      plan: ${{ steps.files.outputs.plan }}
      check: ${{ steps.files.outputs.check }}
    steps:
      - name: List the pull request's files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')
          # The dry-run tooling itself counts for both jobs.
          shared='^(mise\.toml|mise\.lock|\.sops\.yaml|ci/)'
          if grep -qE "^terraform/|$shared" <<<"$files"; then echo plan=true; else echo plan=false; fi >>"$GITHUB_OUTPUT"
          if grep -qE "^ansible/|$shared" <<<"$files"; then echo check=true; else echo check=false; fi >>"$GITHUB_OUTPUT"

  plan:
    name: tofu plan
    needs: changes
    if: needs.changes.outputs.plan == 'true'
    runs-on: [self-hosted, homelab]
    environment: dry-run
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu, SOPS and age (mise)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: opentofu sops age

      - name: Plan as ci
        env:
          SOPS_AGE_KEY: ${{ secrets.CI_AGE_KEY }}
        run: |
          out="$RUNNER_TEMP/plan.txt"
          rc=0
          mise run tofu:plan-ci >"$out" 2>&1 || rc=$?
          {
            echo "## tofu plan"
            if [ "$rc" -ne 0 ]; then echo "Failed (exit $rc): see the encrypted artifact."
            else grep -E '^(Plan:|No changes\.)' "$out" || echo "No summary line: see the encrypted artifact."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          age -r "$OUTPUT_RECIPIENT_HUMAN" -r "$OUTPUT_RECIPIENT_AI_AGENT" -o "$out.age" "$out"
          rm -f "$out"
          exit "$rc"

      - name: Upload the encrypted plan output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan
          path: ${{ runner.temp }}/plan.txt.age
          retention-days: 7
          if-no-files-found: ignore

  check:
    name: ansible-playbook --check
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: [self-hosted, homelab]
    environment: dry-run
    timeout-minutes: 45
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OpenTofu, SOPS, age, Python and uv (mise)
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: opentofu sops age python uv

      - name: Install Ansible and its collections (.venv)
        run: mise run setup:ansible

      - name: Check as ci
        env:
          SOPS_AGE_KEY: ${{ secrets.CI_AGE_KEY }}
        run: |
          out="$RUNNER_TEMP/check.txt"
          rc=0
          mise run ansible:check >"$out" 2>&1 || rc=$?
          {
            echo "## ansible-playbook --check"
            echo '```text'
            sed -n '/^PLAY RECAP/,$p' "$out" | grep -E '^(PLAY RECAP|[A-Za-z0-9_.-]+ +: )' || echo "No recap: see the encrypted artifact."
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          age -r "$OUTPUT_RECIPIENT_HUMAN" -r "$OUTPUT_RECIPIENT_AI_AGENT" -o "$out.age" "$out"
          rm -f "$out"
          exit "$rc"

      - name: Upload the encrypted check output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check
          path: ${{ runner.temp }}/check.txt.age
          retention-days: 7
          if-no-files-found: ignore
