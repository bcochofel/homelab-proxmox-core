---
# Runs semantic-release on every push to main. Config lives in .releaserc.js
# (conventional-commits analyzer -> release notes -> GitHub Release + git
# tag — no CHANGELOG.md file, no commit back to the branch).
# .releaserc.js also allows release/*, feature/*, and fix/* branches to cut
# prereleases, but this workflow deliberately only triggers on main for now —
# this repo's feature/fix branches are short-lived and deleted right after
# merge (see CONTRIBUTING.md), so a prerelease per push there would be mostly
# noise. Widen the `branches:` list here if that's ever wanted.
#
# Uses the default GITHUB_TOKEN, not a PAT. semantic-release used to need a
# fine-grained PAT (SEMANTIC_RELEASE_TOKEN) to bypass main's branch ruleset
# and push a CHANGELOG.md/version-bump commit directly — that's gone now
# that @semantic-release/changelog and @semantic-release/git are dropped
# from .releaserc.js and the org-level PAT was deleted. All that's left
# (publishing a GitHub Release and creating a git tag via the API) isn't a
# branch push, so it isn't blocked by main's "require a pull request" rule
# and needs no bypass actor.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # semantic-release@25 requires Node ^22.14.0 || >=24.10.0 —
          # verified via `npm view semantic-release engines`, not guessed;
          # the first real release.yml run on main failed on exactly this
          # (pinned to 20 initially, wrongly assumed compatible). lts/* over
          # a hardcoded number so this doesn't go stale the same way again.
          node-version: lts/*

      - name: Install release dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
