---
# Runs semantic-release on every push to main. Config lives in .releaserc.js
# (conventional-commits analyzer -> release notes -> GitHub Release + git
# tag — no CHANGELOG.md file, no commit back to the branch).
# Releases come from main only — both this trigger and .releaserc.js's
# `branches` list just `main`. Prerelease branches were dropped: feature/fix
# branches are short-lived and deleted right after merge, so a prerelease per
# push would be noise. Widening this needs both files changed together.
#
# Uses the default GITHUB_TOKEN, not a PAT. semantic-release used to need a
# fine-grained PAT (SEMANTIC_RELEASE_TOKEN) to bypass main's branch ruleset
# and push a CHANGELOG.md/version-bump commit directly — that's gone now
# that @semantic-release/changelog and @semantic-release/git are dropped
# from .releaserc.js and the org-level PAT was deleted. All that's left
# (publishing a GitHub Release and creating a git tag via the API) isn't a
# branch push, so it isn't blocked by main's "require a pull request" rule
# and needs no bypass actor.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js (pinned in mise.toml)
        # Same node as laptops and ci.yml, checksum-verified from mise.lock
        # (MISE_LOCKED) instead of setup-node's floating `lts/*`.
        # semantic-release@25 requires Node ^22.14.0 || >=24.10.0 — verified
        # via `npm view semantic-release engines`; keep mise.toml's node pin
        # inside that range. Only node is installed, and MISE_SKIP_BOOTSTRAP
        # skips mise.toml's postinstall bootstrap (git hooks, Ansible,
        # TFLint...), which would otherwise pull in every other tool.
        uses: jdx/mise-action@v5
        with:
          install_args: node
        env:
          MISE_LOCKED: "1"
          MISE_SKIP_BOOTSTRAP: "1"

      - name: Install release dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
